  <script>
  (function () {
    const dataElement = document.getElementById("page-data");
    const content = document.getElementById("localized-content");
    const selector = document.getElementById("language-select");
    const languageLabel = document.getElementById("language-label");
    const metaDescription = document.querySelector('meta[name="description"]');
    if (!dataElement || !content || !selector) return;

    const data = JSON.parse(dataElement.textContent);
    const storageKey = "rightmenuboost-page-language";
    const languageCodes = new Set(data.languages.map((language) => language.code));

    function normalizeLanguage(value) {
      if (!value) return "";
      const lowered = String(value).trim().toLowerCase();
      if (!lowered) return "";
      if (lowered === "zh" || lowered === "zh-cn" || lowered === "zh-hans" || lowered.startsWith("zh-cn") || lowered.startsWith("zh-sg")) return "zh-Hans";
      if (lowered === "zh-tw" || lowered === "zh-hant" || lowered.startsWith("zh-tw") || lowered.startsWith("zh-hk") || lowered.startsWith("zh-mo")) return "zh-Hant";
      const exact = data.languages.find((language) => language.code.toLowerCase() === lowered || language.htmlLang.toLowerCase() === lowered);
      if (exact) return exact.code;
      const base = lowered.split("-")[0];
      const byBase = data.languages.find((language) => language.code.toLowerCase().split("-")[0] === base);
      return byBase ? byBase.code : "";
    }

    function requestedLanguage() {
      const fromHash = normalizeLanguage(window.location.hash.replace(/^#/, ""));
      if (fromHash && languageCodes.has(fromHash)) return fromHash;
      try {
        const stored = normalizeLanguage(localStorage.getItem(storageKey));
        if (stored && languageCodes.has(stored)) return stored;
      } catch (_) {}
      const browserLanguages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
      for (const value of browserLanguages) {
        const normalized = normalizeLanguage(value);
        if (normalized && languageCodes.has(normalized)) return normalized;
      }
      return data.defaultLanguage;
    }

    function required(value, path) {
      if (typeof value === "string" && value.trim()) return value;
      console.error("Missing localized string", path);
      return `[missing:${path}]`;
    }

    function appendText(tagName, className, text, parent) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }

    function appendList(items, parent, path) {
      if (!Array.isArray(items)) return;
      const list = document.createElement("ul");
      items.forEach((item, index) => appendText("li", "", required(item, `${path}.${index}`), list));
      parent.appendChild(list);
    }

    function appendCards(cards, parent, path) {
      if (!Array.isArray(cards)) return;
      const grid = document.createElement("div");
      grid.className = "cards";
      cards.forEach((card, index) => {
        const item = document.createElement("div");
        item.className = "card";
        appendText("strong", "", required(card.title, `${path}.${index}.title`), item);
        if (card.href) {
          const link = document.createElement("a");
          link.href = card.href;
          link.textContent = required(card.value, `${path}.${index}.value`);
          item.appendChild(link);
        } else {
          appendText("span", "", required(card.value, `${path}.${index}.value`), item);
        }
        grid.appendChild(item);
      });
      parent.appendChild(grid);
    }

    function appendTable(table, parent, path) {
      if (!table || !Array.isArray(table.headers) || !Array.isArray(table.rows)) return;
      const element = document.createElement("table");
      const headerRow = document.createElement("tr");
      table.headers.forEach((header, index) => appendText("th", "", required(header, `${path}.headers.${index}`), headerRow));
      element.appendChild(headerRow);
      table.rows.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        row.forEach((cell, cellIndex) => appendText("td", "", required(cell, `${path}.rows.${rowIndex}.${cellIndex}`), tr));
        element.appendChild(tr);
      });
      parent.appendChild(element);
    }

    function appendLinks(links, parent, languageCode) {
      if (!Array.isArray(links)) return;
      const row = document.createElement("div");
      row.className = "link-row";
      links.forEach((item, index) => {
        const link = document.createElement("a");
        link.className = "pill";
        link.href = localizedUrl(item.href, languageCode);
        link.textContent = required(item.label, `links.${index}.label`);
        row.appendChild(link);
      });
      parent.appendChild(row);
    }

    function localizedUrl(path, languageCode) {
      if (!path) return "#";
      return languageCode === data.defaultLanguage ? path : `${path}#${languageCode}`;
    }

    function shape(value) {
      if (Array.isArray(value)) return value.map(shape);
      if (value && typeof value === "object") {
        return Object.keys(value).sort().reduce((result, key) => {
          if (key !== "href") result[key] = shape(value[key]);
          return result;
        }, {});
      }
      return typeof value;
    }

    function validateData() {
      const requiredCodes = data.languages.map((language) => language.code);
      const referenceContentShape = JSON.stringify(shape(data.content[data.defaultLanguage]));
      const referenceUiShape = JSON.stringify(shape(data.ui[data.defaultLanguage]));
      const errors = [];
      requiredCodes.forEach((code) => {
        if (!data.content[code]) errors.push(`missing content ${code}`);
        if (!data.ui[code]) errors.push(`missing ui ${code}`);
        if (data.content[code] && JSON.stringify(shape(data.content[code])) !== referenceContentShape) errors.push(`content shape mismatch ${code}`);
        if (data.ui[code] && JSON.stringify(shape(data.ui[code])) !== referenceUiShape) errors.push(`ui shape mismatch ${code}`);
      });
      if (errors.length) console.error("RightMenuBoost localization validation failed", errors);
    }

    function render(languageCode) {
      const language = data.languages.find((item) => item.code === languageCode) || data.languages.find((item) => item.code === data.defaultLanguage);
      const code = language.code;
      const ui = data.ui[code];
      const page = data.content[code];
      if (!ui || !page) {
        content.textContent = `[missing-locale:${code}]`;
        return;
      }

      document.documentElement.lang = language.htmlLang;
      document.documentElement.dir = language.dir;
      document.title = required(page.metaTitle, `${code}.metaTitle`);
      if (metaDescription) metaDescription.setAttribute("content", required(page.description, `${code}.description`));
      if (languageLabel) languageLabel.textContent = required(ui.language, `${code}.ui.language`);
      selector.setAttribute("aria-label", required(ui.chooseLanguage, `${code}.ui.chooseLanguage`));
      selector.value = code;

      const navPrivacy = document.querySelector('[data-nav="privacy"]');
      const navSupport = document.querySelector('[data-nav="support"]');
      const navAge = document.querySelector('[data-nav="age"]');
      if (navPrivacy) { navPrivacy.textContent = required(ui.privacy, `${code}.ui.privacy`); navPrivacy.href = localizedUrl("../Privacy/index.html", code); }
      if (navSupport) { navSupport.textContent = required(ui.support, `${code}.ui.support`); navSupport.href = localizedUrl("../Support/index.html", code); }
      if (navAge) { navAge.textContent = required(ui.age, `${code}.ui.age`); navAge.href = localizedUrl("../AgeRating/index.html", code); }

      content.replaceChildren();
      appendText("p", "eyebrow", required(page.eyebrow, `${code}.eyebrow`), content);
      appendText("h1", "", required(page.title, `${code}.title`), content);
      appendText("p", "updated", required(page.updated, `${code}.updated`), content);
      appendText("p", "intro", required(page.intro, `${code}.intro`), content);
      if (page.rating) appendText("div", "rating", required(page.rating, `${code}.rating`), content);
      if (page.notice) {
        const notice = document.createElement("div");
        notice.className = "notice";
        appendText("p", "", required(page.notice, `${code}.notice`), notice);
        content.appendChild(notice);
      }
      appendCards(page.cards, content, `${code}.cards`);
      (page.sections || []).forEach((section, sectionIndex) => {
        const block = document.createElement("section");
        appendText("h2", "", required(section.heading, `${code}.sections.${sectionIndex}.heading`), block);
        (section.paragraphs || []).forEach((paragraph, paragraphIndex) => appendText("p", "", required(paragraph, `${code}.sections.${sectionIndex}.paragraphs.${paragraphIndex}`), block));
        appendList(section.bullets, block, `${code}.sections.${sectionIndex}.bullets`);
        appendTable(section.table, block, `${code}.sections.${sectionIndex}.table`);
        (section.faq || []).forEach((item, itemIndex) => {
          appendText("h3", "", required(item.question, `${code}.sections.${sectionIndex}.faq.${itemIndex}.question`), block);
          appendText("p", "", required(item.answer, `${code}.sections.${sectionIndex}.faq.${itemIndex}.answer`), block);
        });
        content.appendChild(block);
      });
      appendLinks(page.links, content, code);
      try { localStorage.setItem(storageKey, code); } catch (_) {}
    }

    validateData();
    data.languages.forEach((language) => {
      const option = document.createElement("option");
      option.value = language.code;
      option.textContent = language.label;
      selector.appendChild(option);
    });
    selector.addEventListener("change", () => {
      const code = normalizeLanguage(selector.value) || data.defaultLanguage;
      history.replaceState(null, "", code === data.defaultLanguage ? window.location.pathname : `#${code}`);
      render(code);
    });
    window.addEventListener("hashchange", () => render(requestedLanguage()));
    render(requestedLanguage());
  })();
  </script>
</body>
</html>
