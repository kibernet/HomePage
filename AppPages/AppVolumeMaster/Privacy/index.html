<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AppVolumeMaster Privacy Policy</title><meta name="description" content="Privacy policy for AppVolumeMaster."><style>
    :root { color-scheme: dark light; --panel: rgba(17,24,39,.80); --text:#f8fafc; --muted:#cbd5e1; --line:rgba(148,163,184,.24); --accent:#60a5fa; --ok:#67e8f9; }

    table { width:100%; border-collapse:collapse; border:1px solid var(--line); border-radius:14px; overflow:hidden; table-layout:fixed; }
    th,td { padding:12px 14px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }

        </select></div><p class="eyebrow">AppVolumeMaster for Mac</p><h1 data-i18n="title">Privacy Policy</h1><p class="updated" data-i18n="updated"></p><p data-i18n="intro"></p><h2 data-i18n="collectTitle"></h2><p data-i18n="collectBody"></p><h2 data-i18n="localTitle"></h2><p data-i18n="localBody"></p><h2 data-i18n="audioTitle"></h2><p data-i18n="audioBody"></p><h2 data-i18n="permTitle"></h2><p data-i18n="permBody"></p><h2 data-i18n="networkTitle"></h2><p data-i18n="networkBody"></p><h2 data-i18n="deleteTitle"></h2><p data-i18n="deleteBody"></p><h2 data-i18n="childTitle"></h2><p data-i18n="childBody"></p><h2 data-i18n="changeTitle"></h2><p data-i18n="changeBody"></p><h2 data-i18n="contactTitle"></h2><p><span data-i18n="contact"></span> <a href="mailto:kibernet@sina.com">kibernet@sina.com</a>.</p></div></div><script>const translations={"en":{"languageLabel":"Language","title":"Privacy Policy","updated":"Last updated: June 21, 2026","intro":"AppVolumeMaster is a local-first Mac menu bar utility for per-app audio control. It works without accounts, cloud sync, advertising, analytics, or tracking.","collectTitle":"Data We Collect","collectBody":"AppVolumeMaster does not collect personal data. The app does not require sign-in, does not operate a remote service, and does not include advertising, analytics, or tracking SDKs.","localTitle":"Data Stored on Your Mac","localBody":"The app stores per-app mute and volume preferences, search and display preferences, launch-at-login settings, and diagnostics that you explicitly copy or export. This data remains on your device.","audioTitle":"Audio Handling","audioBody":"AppVolumeMaster uses macOS audio APIs to identify audio-producing apps and apply local audio control behavior. It does not record audio files, upload audio content, sell audio data, or share audio with third parties.","permTitle":"System Permissions","permBody":"The app may request system audio capture permission only to identify and control audio-producing apps locally.","networkTitle":"Network Access","networkBody":"The current app does not use networking to collect user data and has no cloud service dependency.","deleteTitle":"Data Deletion","deleteBody":"You can delete local preferences by removing the app settings from your Mac. Diagnostics leave your device only when you choose to copy or send them.","childTitle":"Children's Privacy","childBody":"AppVolumeMaster is a general utility and is not directed to children. It does not knowingly collect information from children or other users.","contactTitle":"Contact","contact":"If you have questions about this privacy policy, contact us at","changeTitle":"Changes to This Policy","changeBody":"If this policy changes, the updated version will be posted on this page with a revised update date. AppVolumeMaster keeps this page available so users and App Review can verify privacy handling before installation."},"zh-Hans":{"languageLabel":"语言","title":"隐私政策","updated":"更新日期：2026 年 6 月 21 日","intro":"AppVolumeMaster（声控大师）是面向 Mac 的本地优先菜单栏音频控制工具，用于按应用管理声音。应用不需要账号、云同步、广告、分析或追踪。","collectTitle":"我们收集的数据","collectBody":"AppVolumeMaster 不收集个人数据。应用不需要登录，不运营远程服务，也不包含广告、分析或追踪开发工具包。","localTitle":"保存在 Mac 上的数据","localBody":"应用会在本机保存每个应用的静音和音量偏好、搜索和显示偏好、登录启动设置，以及你主动复制或导出的诊断信息。这些数据保留在你的设备上。","audioTitle":"音频处理","audioBody":"AppVolumeMaster 使用 macOS 音频接口在本机识别正在发声的应用并应用本地音频控制。它不会录制音频文件、上传音频内容、出售音频数据或与第三方共享音频。","permTitle":"系统权限","permBody":"应用可能会请求系统音频捕获权限，仅用于在本机识别和控制正在发声的应用。","networkTitle":"网络访问","networkBody":"当前应用不会通过网络收集用户数据，也不依赖云端服务。","deleteTitle":"数据删除","deleteBody":"你可以通过删除 App 在 Mac 上的本地设置来清理偏好数据。诊断信息只有在你主动复制或发送时才会离开设备。","childTitle":"儿童隐私","childBody":"AppVolumeMaster 是通用工具型应用，并非面向儿童。应用不会有意收集儿童或其他用户的信息。","contactTitle":"联系方式","contact":"如对本隐私政策有疑问，请联系：","changeTitle":"政策变更","changeBody":"当本隐私政策有变更时，更新版本会发布在此页面并同步更新日期。AppVolumeMaster 会持续保留该页面，方便用户和 App 审核在安装前确认隐私处理方式。"},"zh-Hant":{"languageLabel":"語言","title":"隱私權政策","updated":"更新日期：2026 年 6 月 21 日","intro":"AppVolumeMaster 是面向 Mac 的本機優先選單列音訊控制工具，用於按 App 管理聲音。應用程式不需要帳號、雲端同步、廣告、分析或追蹤。","collectTitle":"我們收集的資料","collectBody":"AppVolumeMaster 不收集個人資料。應用程式不需要登入、不營運遠端服務，也不包含廣告、分析或追蹤開發工具包。","localTitle":"儲存在 Mac 上的資料","localBody":"應用程式會在本機儲存每個 App 的靜音與音量偏好、搜尋與顯示偏好、登入時啟動設定，以及你主動複製或匯出的診斷資訊。這些資料會保留在你的裝置上。","audioTitle":"音訊處理","audioBody":"AppVolumeMaster 使用 macOS 音訊介面在本機識別正在發聲的 App 並套用本地音訊控制。它不會錄製音訊檔案、上傳音訊內容、出售音訊資料，或與第三方分享音訊。","permTitle":"系統權限","permBody":"應用程式可能會要求系統音訊擷取權限，僅用於在本機識別和控制正在發聲的 App。","networkTitle":"網路存取","networkBody":"目前的應用程式不會透過網路收集使用者資料，也不依賴雲端服務。","deleteTitle":"資料刪除","deleteBody":"你可以刪除 Mac 上的應用程式本機設定來清除偏好資料。診斷資訊只有在你選擇複製或傳送時才會離開裝置。","childTitle":"兒童隱私","childBody":"AppVolumeMaster 是通用工具型應用程式，並非針對兒童設計。它不會有意收集兒童或其他使用者的資訊。","contactTitle":"聯絡方式","contact":"如對本隱私權政策有疑問，請聯絡：","changeTitle":"政策變更","changeBody":"如果本政策有所變更，更新版本會在此頁面發布並附上修訂後的更新日期。AppVolumeMaster 會保留此頁面，方便使用者和 App 審核在安裝前確認隱私處理方式。"},"ja":{"languageLabel":"言語","title":"プライバシーポリシー","updated":"最終更新日：2026年6月21日","intro":"AppVolumeMaster は、Mac のアプリ別音声制御のためのローカル優先メニューバーユーティリティです。アカウント、クラウド同期、広告、分析、追跡なしで動作します。","collectTitle":"収集するデータ","collectBody":"AppVolumeMaster は個人データを収集しません。サインインは不要で、リモートサービスを運営せず、広告、分析、追跡用の開発キットも含みません。","localTitle":"Mac に保存されるデータ","localBody":"アプリ別のミュートと音量の設定、検索と表示の設定、ログイン時起動の設定、およびユーザーが明示的にコピーまたは書き出した診断情報を保存します。このデータは端末内に残ります。","audioTitle":"音声の取り扱い","audioBody":"AppVolumeMaster は macOS の音声インターフェイスを使用して、音声を出しているアプリをローカルで識別し、ローカルの音声制御を適用します。音声ファイルの録音、音声内容のアップロード、音声データの販売、第三者との共有は行いません。","permTitle":"システム権限","permBody":"音声を出しているアプリをローカルで識別して制御する目的に限り、システム音声キャプチャ権限を求める場合があります。","networkTitle":"ネットワークアクセス","networkBody":"現在のアプリは、ユーザーデータを収集するためのネットワーク通信を行わず、クラウドサービスにも依存しません。","deleteTitle":"データの削除","deleteBody":"Mac 上のアプリ設定を削除することで、ローカルの設定データを削除できます。診断情報は、ユーザーがコピーまたは送信した場合にのみ端末外へ出ます。","childTitle":"子どものプライバシー","childBody":"AppVolumeMaster は一般向けユーティリティであり、子どもを対象としていません。子どもやその他のユーザーの情報を意図的に収集することはありません。","contactTitle":"お問い合わせ","contact":"このプライバシーポリシーについてのご質問は、以下までご連絡ください：","changeTitle":"本ポリシーの変更","changeBody":"本ポリシーが変更された場合、更新版は改訂日とともにこのページに掲載されます。AppVolumeMaster は、ユーザーおよび App 審査がインストール前にプライバシーの取り扱いを確認できるよう、このページを公開し続けます。"},"ko":{"languageLabel":"언어","title":"개인정보 처리방침","updated":"최종 업데이트: 2026년 6월 21일","intro":"AppVolumeMaster는 Mac에서 앱별 오디오를 제어하는 로컬 우선 메뉴 막대 유틸리티입니다. 계정, 클라우드 동기화, 광고, 분석 또는 추적 없이 작동합니다.","collectTitle":"수집하는 데이터","collectBody":"AppVolumeMaster는 개인 데이터를 수집하지 않습니다. 로그인도 필요하지 않고, 원격 서비스를 운영하지 않으며, 광고, 분석 또는 추적용 개발 도구도 포함하지 않습니다.","localTitle":"Mac에 저장되는 데이터","localBody":"앱별 음소거 및 볼륨 기본 설정, 검색 및 표시 기본 설정, 로그인 시 실행 설정, 사용자가 직접 복사하거나 내보낸 진단 정보를 저장합니다. 이 데이터는 기기에 남아 있습니다.","audioTitle":"오디오 처리","audioBody":"AppVolumeMaster는 macOS 오디오 인터페이스를 사용해 오디오를 내는 앱을 로컬에서 식별하고 로컬 오디오 제어를 적용합니다. 오디오 파일을 녹음하거나, 오디오 콘텐츠를 업로드하거나, 오디오 데이터를 판매하거나, 제3자와 공유하지 않습니다.","permTitle":"시스템 권한","permBody":"앱은 오디오를 내는 앱을 로컬에서 식별하고 제어하기 위한 목적으로만 시스템 오디오 캡처 권한을 요청할 수 있습니다.","networkTitle":"네트워크 접근","networkBody":"현재 앱은 사용자 데이터를 수집하기 위해 네트워크를 사용하지 않으며 클라우드 서비스에 의존하지 않습니다.","deleteTitle":"데이터 삭제","deleteBody":"Mac에서 앱 설정을 제거하면 로컬 기본 설정 데이터를 삭제할 수 있습니다. 진단 정보는 사용자가 복사하거나 전송하기로 선택한 경우에만 기기를 벗어납니다.","childTitle":"아동 개인정보","childBody":"AppVolumeMaster는 일반 유틸리티이며 아동을 대상으로 하지 않습니다. 아동이나 다른 사용자로부터 정보를 고의로 수집하지 않습니다.","contactTitle":"문의","contact":"이 개인정보 처리방침에 대한 질문은 다음으로 문의하세요:","changeTitle":"정책 변경","changeBody":"이 정책이 변경되면 업데이트된 버전이 수정된 날짜와 함께 이 페이지에 게시됩니다. AppVolumeMaster는 사용자와 App 심사가 설치 전에 개인정보 처리 방식을 확인할 수 있도록 이 페이지를 계속 제공합니다."},"es":{"languageLabel":"Idioma","title":"Política de privacidad","updated":"Última actualización: 21 de junio de 2026","intro":"AppVolumeMaster es una utilidad de barra de menús para Mac, local primero, para controlar el audio por aplicación. Funciona sin cuentas, sincronización en la nube, publicidad, analíticas ni seguimiento.","collectTitle":"Datos que recopilamos","collectBody":"AppVolumeMaster no recopila datos personales. La app no requiere iniciar sesión, no opera un servicio remoto y no incluye herramientas de publicidad, analíticas ni seguimiento.","localTitle":"Datos almacenados en tu Mac","localBody":"La app almacena preferencias de silencio y volumen por aplicación, preferencias de búsqueda y visualización, ajustes de inicio de sesión y diagnósticos que copias o exportas explícitamente. Estos datos permanecen en tu dispositivo.","audioTitle":"Tratamiento del audio","audioBody":"AppVolumeMaster usa interfaces de audio de macOS para identificar localmente las apps que producen sonido y aplicar controles locales. No graba archivos de audio, no sube contenido de audio, no vende datos de audio ni comparte audio con terceros.","permTitle":"Permisos del sistema","permBody":"La app puede solicitar permiso de captura de audio del sistema solo para identificar y controlar localmente las apps que producen sonido.","networkTitle":"Acceso a la red","networkBody":"La app actual no usa la red para recopilar datos de usuario y no depende de ningún servicio en la nube.","deleteTitle":"Eliminación de datos","deleteBody":"Puedes eliminar las preferencias locales quitando los ajustes de la app de tu Mac. Los diagnósticos salen de tu dispositivo solo cuando eliges copiarlos o enviarlos.","childTitle":"Privacidad de menores","childBody":"AppVolumeMaster es una utilidad general y no está dirigida a menores. No recopila intencionadamente información de menores ni de otros usuarios.","contactTitle":"Contacto","contact":"Si tienes preguntas sobre esta política de privacidad, contáctanos en","changeTitle":"Cambios en esta política","changeBody":"Si esta política cambia, la versión actualizada se publicará en esta página con una nueva fecha de actualización. AppVolumeMaster mantiene esta página disponible para que los usuarios y la revisión de App puedan verificar el tratamiento de privacidad antes de la instalación."},"fr":{"languageLabel":"Langue","title":"Politique de confidentialité","updated":"Dernière mise à jour : 21 juin 2026","intro":"AppVolumeMaster est un utilitaire de barre de menus Mac, local d’abord, pour contrôler l’audio par application. Il fonctionne sans compte, synchronisation cloud, publicité, analyse ni suivi.","collectTitle":"Données que nous collectons","collectBody":"AppVolumeMaster ne collecte pas de données personnelles. L’app ne nécessite aucune connexion, n’exploite aucun service distant et n’inclut aucun outil de publicité, d’analyse ou de suivi.","localTitle":"Données stockées sur votre Mac","localBody":"L’app stocke les préférences de sourdine et de volume par application, les préférences de recherche et d’affichage, les réglages de lancement à la connexion ainsi que les diagnostics que vous copiez ou exportez explicitement. Ces données restent sur votre appareil.","audioTitle":"Traitement de l’audio","audioBody":"AppVolumeMaster utilise les interfaces audio de macOS pour identifier localement les apps qui produisent du son et appliquer des contrôles locaux. Il n’enregistre pas de fichiers audio, ne téléverse pas de contenu audio, ne vend pas de données audio et ne partage pas l’audio avec des tiers.","permTitle":"Autorisations système","permBody":"L’app peut demander l’autorisation de capture audio du système uniquement pour identifier et contrôler localement les apps qui produisent du son.","networkTitle":"Accès réseau","networkBody":"L’app actuelle n’utilise pas le réseau pour collecter des données utilisateur et ne dépend d’aucun service cloud.","deleteTitle":"Suppression des données","deleteBody":"Vous pouvez supprimer les préférences locales en retirant les réglages de l’app de votre Mac. Les diagnostics ne quittent votre appareil que lorsque vous choisissez de les copier ou de les envoyer.","childTitle":"Confidentialité des enfants","childBody":"AppVolumeMaster est un utilitaire général et ne s’adresse pas aux enfants. Il ne collecte pas sciemment d’informations auprès d’enfants ou d’autres utilisateurs.","contactTitle":"Contact","contact":"Pour toute question sur cette politique de confidentialité, contactez-nous à","changeTitle":"Modifications de cette politique","changeBody":"Si cette politique change, la version mise à jour sera publiée sur cette page avec une date de mise à jour révisée. AppVolumeMaster garde cette page disponible afin que les utilisateurs et la revue App puissent vérifier le traitement de la confidentialité avant l’installation."},"de":{"languageLabel":"Sprache","title":"Datenschutzrichtlinie","updated":"Zuletzt aktualisiert: 21. Juni 2026","intro":"AppVolumeMaster ist ein lokal arbeitendes Mac-Menüleistenprogramm zur Audiosteuerung pro App. Es funktioniert ohne Konto, Cloud-Synchronisierung, Werbung, Analyse oder Tracking.","collectTitle":"Daten, die wir erfassen","collectBody":"AppVolumeMaster erfasst keine personenbezogenen Daten. Die App erfordert keine Anmeldung, betreibt keinen entfernten Dienst und enthält keine Werkzeuge für Werbung, Analyse oder Tracking.","localTitle":"Auf Ihrem Mac gespeicherte Daten","localBody":"Die App speichert Stumm- und Lautstärkeeinstellungen pro App, Such- und Anzeigeeinstellungen, Einstellungen für den Start bei der Anmeldung sowie Diagnosedaten, die Sie ausdrücklich kopieren oder exportieren. Diese Daten bleiben auf Ihrem Gerät.","audioTitle":"Umgang mit Audio","audioBody":"AppVolumeMaster verwendet macOS-Audioschnittstellen, um lokal Apps zu erkennen, die Ton ausgeben, und lokale Audiosteuerung anzuwenden. Es zeichnet keine Audiodateien auf, lädt keine Audioinhalte hoch, verkauft keine Audiodaten und teilt Audio nicht mit Dritten.","permTitle":"Systemberechtigungen","permBody":"Die App kann die Berechtigung zur System-Audioerfassung nur anfordern, um Apps, die Ton ausgeben, lokal zu erkennen und zu steuern.","networkTitle":"Netzwerkzugriff","networkBody":"Die aktuelle App verwendet kein Netzwerk, um Benutzerdaten zu erfassen, und ist von keinem Clouddienst abhängig.","deleteTitle":"Datenlöschung","deleteBody":"Sie können lokale Einstellungen löschen, indem Sie die App-Einstellungen von Ihrem Mac entfernen. Diagnosedaten verlassen Ihr Gerät nur, wenn Sie sie kopieren oder senden.","childTitle":"Datenschutz von Kindern","childBody":"AppVolumeMaster ist ein allgemeines Dienstprogramm und richtet sich nicht an Kinder. Es sammelt wissentlich keine Informationen von Kindern oder anderen Benutzern.","contactTitle":"Kontakt","contact":"Bei Fragen zu dieser Datenschutzrichtlinie kontaktieren Sie uns unter","changeTitle":"Änderungen an dieser Richtlinie","changeBody":"Wenn sich diese Richtlinie ändert, wird die aktualisierte Version mit einem überarbeiteten Aktualisierungsdatum auf dieser Seite veröffentlicht. AppVolumeMaster hält diese Seite verfügbar, damit Benutzer und App Review die Datenschutzverarbeitung vor der Installation prüfen können."},"it":{"languageLabel":"Lingua","title":"Informativa sulla privacy","updated":"Ultimo aggiornamento: 21 giugno 2026","intro":"AppVolumeMaster è un’utilità locale per la barra dei menu Mac per controllare l’audio per app. Funziona senza account, sincronizzazione cloud, pubblicità, analisi o tracciamento.","collectTitle":"Dati che raccogliamo","collectBody":"AppVolumeMaster non raccoglie dati personali. L’app non richiede accesso, non gestisce un servizio remoto e non include strumenti di pubblicità, analisi o tracciamento.","localTitle":"Dati archiviati sul tuo Mac","localBody":"L’app archivia preferenze di silenziamento e volume per app, preferenze di ricerca e visualizzazione, impostazioni di avvio all’accesso e diagnostica che copi o esporti esplicitamente. Questi dati restano sul tuo dispositivo.","audioTitle":"Gestione dell’audio","audioBody":"AppVolumeMaster usa le interfacce audio di macOS per identificare localmente le app che producono audio e applicare controlli locali. Non registra file audio, non carica contenuti audio, non vende dati audio e non condivide audio con terze parti.","permTitle":"Autorizzazioni di sistema","permBody":"L’app può richiedere l’autorizzazione di acquisizione audio di sistema solo per identificare e controllare localmente le app che producono audio.","networkTitle":"Accesso alla rete","networkBody":"L’app attuale non usa la rete per raccogliere dati utente e non dipende da servizi cloud.","deleteTitle":"Eliminazione dei dati","deleteBody":"Puoi eliminare le preferenze locali rimuovendo le impostazioni dell’app dal tuo Mac. La diagnostica lascia il dispositivo solo quando scegli di copiarla o inviarla.","childTitle":"Privacy dei minori","childBody":"AppVolumeMaster è un’utilità generale e non è rivolta ai minori. Non raccoglie consapevolmente informazioni da minori o altri utenti.","contactTitle":"Contatto","contact":"Per domande su questa informativa sulla privacy, contattaci a","changeTitle":"Modifiche a questa informativa","changeBody":"Se questa informativa cambia, la versione aggiornata sarà pubblicata su questa pagina con una nuova data di aggiornamento. AppVolumeMaster mantiene disponibile questa pagina affinché utenti e revisione App possano verificare il trattamento della privacy prima dell’installazione."},"pt-BR":{"languageLabel":"Idioma","title":"Política de privacidade","updated":"Última atualização: 21 de junho de 2026","intro":"AppVolumeMaster é um utilitário de barra de menus para Mac, local primeiro, para controlar áudio por app. Funciona sem conta, sincronização em nuvem, anúncios, análises ou rastreamento.","collectTitle":"Dados que coletamos","collectBody":"AppVolumeMaster não coleta dados pessoais. O app não exige login, não opera um serviço remoto e não inclui ferramentas de anúncios, análises ou rastreamento.","localTitle":"Dados armazenados no seu Mac","localBody":"O app armazena preferências de silenciar e volume por app, preferências de busca e exibição, ajustes de iniciar ao entrar e diagnósticos que você copia ou exporta explicitamente. Esses dados permanecem no seu dispositivo.","audioTitle":"Tratamento de áudio","audioBody":"AppVolumeMaster usa interfaces de áudio do macOS para identificar localmente apps que produzem som e aplicar controles locais. Ele não grava arquivos de áudio, não envia conteúdo de áudio, não vende dados de áudio e não compartilha áudio com terceiros.","permTitle":"Permissões do sistema","permBody":"O app pode solicitar permissão de captura de áudio do sistema apenas para identificar e controlar localmente apps que produzem som.","networkTitle":"Acesso à rede","networkBody":"O app atual não usa rede para coletar dados do usuário e não depende de serviço em nuvem.","deleteTitle":"Exclusão de dados","deleteBody":"Você pode excluir preferências locais removendo os ajustes do app no seu Mac. Diagnósticos só saem do dispositivo quando você escolhe copiá-los ou enviá-los.","childTitle":"Privacidade de crianças","childBody":"AppVolumeMaster é um utilitário geral e não é direcionado a crianças. Ele não coleta intencionalmente informações de crianças ou outros usuários.","contactTitle":"Contato","contact":"Se tiver dúvidas sobre esta política de privacidade, entre em contato em","changeTitle":"Alterações nesta política","changeBody":"Se esta política mudar, a versão atualizada será publicada nesta página com uma data de atualização revisada. AppVolumeMaster mantém esta página disponível para que usuários e a revisão de App possam verificar o tratamento de privacidade antes da instalação."},"ru":{"languageLabel":"Язык","title":"Политика конфиденциальности","updated":"Обновлено: 21 июня 2026 г.","intro":"AppVolumeMaster — локальная утилита строки меню Mac для управления звуком по приложениям. Она работает без аккаунтов, облачной синхронизации, рекламы, аналитики и отслеживания.","collectTitle":"Какие данные мы собираем","collectBody":"AppVolumeMaster не собирает персональные данные. Приложение не требует входа, не использует удаленный сервис и не содержит инструментов рекламы, аналитики или отслеживания.","localTitle":"Данные, хранящиеся на вашем Mac","localBody":"Приложение хранит настройки отключения звука и громкости для отдельных приложений, параметры поиска и отображения, настройки запуска при входе в систему и диагностику, которую вы явно копируете или экспортируете. Эти данные остаются на вашем устройстве.","audioTitle":"Обработка аудио","audioBody":"AppVolumeMaster использует аудиоинтерфейсы macOS, чтобы локально определять приложения, воспроизводящие звук, и применять локальное управление звуком. Оно не записывает аудиофайлы, не загружает аудиоконтент, не продает аудиоданные и не передает аудио третьим лицам.","permTitle":"Системные разрешения","permBody":"Приложение может запросить разрешение на захват системного аудио только для локального определения и управления приложениями, которые воспроизводят звук.","networkTitle":"Доступ к сети","networkBody":"Текущая версия приложения не использует сеть для сбора пользовательских данных и не зависит от облачного сервиса.","deleteTitle":"Удаление данных","deleteBody":"Вы можете удалить локальные предпочтения, удалив настройки приложения на своем Mac. Диагностика покидает устройство только тогда, когда вы выбираете ее копирование или отправку.","childTitle":"Конфиденциальность детей","childBody":"AppVolumeMaster является универсальной утилитой и не предназначено для детей. Оно сознательно не собирает информацию от детей или других пользователей.","contactTitle":"Контакты","contact":"Если у вас есть вопросы об этой политике конфиденциальности, напишите нам:","changeTitle":"Изменения этой политики","changeBody":"Если эта политика изменится, обновленная версия будет опубликована на этой странице с новой датой обновления. AppVolumeMaster сохраняет эту страницу доступной, чтобы пользователи и проверка App могли подтвердить обработку конфиденциальности перед установкой."},"ar":{"languageLabel":"اللغة","title":"سياسة الخصوصية","updated":"آخر تحديث: 21 يونيو 2026","intro":"AppVolumeMaster أداة محلية لشريط قوائم Mac للتحكم في صوت كل تطبيق. تعمل بدون حسابات أو مزامنة سحابية أو إعلانات أو تحليلات أو تتبع.","collectTitle":"البيانات التي نجمعها","collectBody":"لا يجمع AppVolumeMaster بيانات شخصية. لا يتطلب التطبيق تسجيل الدخول، ولا يشغل خدمة بعيدة، ولا يتضمن أدوات للإعلانات أو التحليلات أو التتبع.","localTitle":"البيانات المخزنة على Mac الخاص بك","localBody":"يخزن التطبيق تفضيلات كتم الصوت ومستوى الصوت لكل تطبيق، وتفضيلات البحث والعرض، وإعدادات التشغيل عند تسجيل الدخول، والتشخيصات التي تختار نسخها أو تصديرها صراحة. تبقى هذه البيانات على جهازك.","audioTitle":"معالجة الصوت","audioBody":"يستخدم AppVolumeMaster واجهات الصوت في macOS للتعرف محليا على التطبيقات التي تصدر صوتا وتطبيق التحكم المحلي في الصوت. لا يسجل ملفات صوتية، ولا يرفع محتوى صوتيا، ولا يبيع بيانات الصوت، ولا يشارك الصوت مع أطراف ثالثة.","permTitle":"أذونات النظام","permBody":"قد يطلب التطبيق إذن التقاط صوت النظام فقط للتعرف محليا على التطبيقات التي تصدر صوتا والتحكم فيها.","networkTitle":"الوصول إلى الشبكة","networkBody":"لا يستخدم التطبيق الحالي الشبكة لجمع بيانات المستخدم ولا يعتمد على خدمة سحابية.","deleteTitle":"حذف البيانات","deleteBody":"يمكنك حذف التفضيلات المحلية بإزالة إعدادات التطبيق من جهاز Mac. لا تغادر التشخيصات جهازك إلا عندما تختار نسخها أو إرسالها.","childTitle":"خصوصية الأطفال","childBody":"AppVolumeMaster أداة عامة وليست موجهة للأطفال. لا يجمع التطبيق عن قصد معلومات من الأطفال أو من مستخدمين آخرين.","contactTitle":"التواصل","contact":"إذا كانت لديك أسئلة حول سياسة الخصوصية هذه، تواصل معنا عبر","changeTitle":"التغييرات على هذه السياسة","changeBody":"إذا تغيرت هذه السياسة، فسيتم نشر النسخة المحدثة في هذه الصفحة مع تاريخ تحديث جديد. يبقي AppVolumeMaster هذه الصفحة متاحة حتى يتمكن المستخدمون ومراجعة App من التحقق من طريقة التعامل مع الخصوصية قبل التثبيت."},"hi":{"languageLabel":"भाषा","title":"गोपनीयता नीति","updated":"अंतिम अपडेट: 21 जून 2026","intro":"AppVolumeMaster Mac के लिए स्थानीय-प्रथम मेनू बार ऑडियो नियंत्रण टूल है, जिससे हर ऐप का ऑडियो नियंत्रित किया जा सकता है। यह खाते, क्लाउड सिंक, विज्ञापन, एनालिटिक्स या ट्रैकिंग के बिना काम करता है।","collectTitle":"हम कौन सा डेटा इकट्ठा करते हैं","collectBody":"AppVolumeMaster व्यक्तिगत डेटा इकट्ठा नहीं करता। ऐप में साइन इन की जरूरत नहीं है, यह कोई रिमोट सेवा नहीं चलाता और इसमें विज्ञापन, एनालिटिक्स या ट्रैकिंग टूल शामिल नहीं हैं।","localTitle":"आपके Mac पर संग्रहीत डेटा","localBody":"ऐप हर ऐप के म्यूट और वॉल्यूम प्रेफरेंस, खोज और डिस्प्ले प्रेफरेंस, लॉगिन पर लॉन्च सेटिंग और वे डायग्नोस्टिक्स संग्रहीत करता है जिन्हें आप स्पष्ट रूप से कॉपी या एक्सपोर्ट करते हैं। यह डेटा आपके डिवाइस पर ही रहता है।","audioTitle":"ऑडियो का प्रबंधन","audioBody":"AppVolumeMaster macOS ऑडियो इंटरफेस का उपयोग करके ऑडियो उत्पन्न करने वाले ऐप्स को स्थानीय रूप से पहचानता है और स्थानीय ऑडियो नियंत्रण लागू करता है। यह ऑडियो फ़ाइलें रिकॉर्ड नहीं करता, ऑडियो सामग्री अपलोड नहीं करता, ऑडियो डेटा नहीं बेचता और तीसरे पक्षों के साथ ऑडियो साझा नहीं करता।","permTitle":"सिस्टम अनुमतियां","permBody":"ऐप केवल ऑडियो उत्पन्न करने वाले ऐप्स को स्थानीय रूप से पहचानने और नियंत्रित करने के लिए सिस्टम ऑडियो कैप्चर अनुमति मांग सकता है।","networkTitle":"नेटवर्क पहुंच","networkBody":"वर्तमान ऐप उपयोगकर्ता डेटा इकट्ठा करने के लिए नेटवर्क का उपयोग नहीं करता और किसी क्लाउड सेवा पर निर्भर नहीं है।","deleteTitle":"डेटा हटाना","deleteBody":"आप अपने Mac से ऐप सेटिंग हटाकर स्थानीय प्रेफरेंस मिटा सकते हैं। डायग्नोस्टिक्स आपके डिवाइस से तभी बाहर जाते हैं जब आप उन्हें कॉपी या भेजना चुनते हैं।","childTitle":"बच्चों की गोपनीयता","childBody":"AppVolumeMaster एक सामान्य उपयोगिता है और बच्चों के लिए लक्षित नहीं है। यह बच्चों या अन्य उपयोगकर्ताओं से जानबूझकर जानकारी इकट्ठा नहीं करता।","contactTitle":"संपर्क","contact":"इस गोपनीयता नीति के बारे में प्रश्न हों तो हमसे संपर्क करें:","changeTitle":"इस नीति में बदलाव","changeBody":"यदि यह नीति बदलती है, तो अपडेट किया गया संस्करण संशोधित तारीख के साथ इस पेज पर पोस्ट किया जाएगा। AppVolumeMaster इस पेज को उपलब्ध रखता है ताकि उपयोगकर्ता और App समीक्षा इंस्टॉल करने से पहले गोपनीयता प्रबंधन की पुष्टि कर सकें।"}};const supportedLanguages=Object.keys(translations);const params=new URLSearchParams(location.search);function browserLanguage(){const prefs=[navigator.language,...(navigator.languages||[])].map(v=>String(v||'').toLowerCase());for(const pref of prefs){if(pref.startsWith('zh-hant')||pref.startsWith('zh-tw')||pref.startsWith('zh-hk'))return 'zh-Hant';if(pref.startsWith('zh'))return 'zh-Hans';if(pref.startsWith('pt'))return 'pt-BR';const hit=supportedLanguages.find(code=>pref===code.toLowerCase()||pref.startsWith(code.toLowerCase()+'-'));if(hit)return hit;}return 'en'}const initial=supportedLanguages.includes(params.get('lang'))?params.get('lang'):browserLanguage();function applyLanguage(lang){const t=translations[lang]||translations.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title='AppVolumeMaster - '+(t.title||'');const select=document.getElementById('languageSelect');select.value=lang;document.getElementById('languageLabel').textContent=t.languageLabel||'Language';select.setAttribute('aria-label',t.languageLabel||'Language');document.querySelectorAll('[data-i18n]').forEach(node=>{const key=node.dataset.i18n;if(Object.prototype.hasOwnProperty.call(t,key))node.innerHTML=t[key];});}document.getElementById('languageSelect').addEventListener('change',e=>{const next=e.target.value;location.href=next==='en'?location.pathname:location.pathname+'?lang='+encodeURIComponent(next);});applyLanguage(initial);</script></body></html>
