    a { color: var(--accent); overflow-wrap: anywhere; }
    .eyebrow { margin: 0 0 24px; color: var(--accent); font-weight: 700; }

            "A versão para Mac oferece suporte ao seletor de arquivos do sistema, à importação por arrastar e soltar e ao painel de exportação para salvar os resultados."
          ],
          [
            "Por que os resultados dos reparos são diferentes?",
            "Os resultados da conclusão da imagem são afetados pelo conteúdo da imagem, pela área de mascaramento e pelos detalhes das bordas. Geralmente, recomenda-se marcar apenas as áreas que precisam de reparo e evitar pintar sobre uma área muito grande de uma só vez."
          ]
        ]
      ],
      [
        "política de Privacidade",
        "Você pode consultar a política de privacidade aqui: ${privacyLink}"
      ],
      [
        "Contate o suporte",
        "Ao enviar o e-mail, especifique seu dispositivo, versão do sistema, versão do aplicativo, etapas de operação e se o problema pode ser reproduzido de forma consistente."
      ]
    ]
  }
};
    function hydrateLinks(value) {
      return String(value)
        .replaceAll('${privacyLink}', privacyLink)
        .replaceAll('PRIVACY_URL_PLACEHOLDER', privacyLink);
    }
    function build(locale) {
      const t = translations[locale] || translations.en;
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
      document.title = t.title + ' - LuminaSage';
      document.getElementById('languageLabel').textContent = t.languageLabel;
      document.querySelector('[data-i18n="eyebrow"]').textContent = t.eyebrow;
      document.querySelector('[data-i18n="title"]').textContent = t.title;
      document.querySelector('[data-i18n="intro"]').textContent = t.intro;
      document.querySelector('[data-i18n="emailLabel"]').textContent = t.emailLabel;
      document.getElementById('content').innerHTML = t.sections.map(([title, body]) => {
        if (Array.isArray(body)) { return `<section><h2>${hydrateLinks(title)}</h2>${body.map(([q, a]) => `<h3>${hydrateLinks(q)}</h3><p>${hydrateLinks(a)}</p>`).join('')}</section>`; }
        return `<section><h2>${hydrateLinks(title)}</h2><p>${hydrateLinks(body)}</p></section>`;
      }).join('');
    }
    document.getElementById('languageSelect').addEventListener('change', event => build(event.target.value));
    build('zh-Hans');
  </script>
</body>
</html>
