  </script>
  <script>
    const data = JSON.parse(document.getElementById('page-data').textContent);
    const select = document.getElementById('language-select');
    const content = document.getElementById('localized-content');
    const navItems = document.querySelectorAll('[data-nav]');
    const label = document.getElementById('language-label');
    const storageKey = 'luminasage-page-language';

    function normalizeLanguage(value) {
      if (!value) return data.defaultLanguage;
      const lower = value.toLowerCase();
      if (lower === 'zh-hans' || lower === 'zh-cn' || lower === 'zh-sg') return 'zh-Hans';
      if (lower === 'zh-hant' || lower === 'zh-tw' || lower === 'zh-hk' || lower === 'zh-mo') return 'zh-Hant';
      const base = lower.split('-')[0];
      return data.languages.some((item) => item.code === base) ? base : data.defaultLanguage;
    }

    function preferredLanguage() {
      const saved = localStorage.getItem(storageKey);
      if (saved && data.languages.some((item) => item.code === saved)) return saved;
      for (const lang of navigator.languages || [navigator.language]) {
        const normalized = normalizeLanguage(lang);
        if (data.languages.some((item) => item.code === normalized)) return normalized;
      }
      return data.defaultLanguage;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    function paragraphList(items) {
      return items.map((item) => `<p>${escapeHtml(item)}</p>`).join('');
    }

    function renderLinks(page) {
      if (!page.links || !page.links.length) return '';
      const links = page.links.map((item) => `<a class="pill" href="${escapeHtml(item.href)}"><strong>${escapeHtml(item.label)}</strong>&nbsp;${escapeHtml(item.text)}</a>`).join('');
      return `<h2>${escapeHtml(page.linksTitle)}</h2><div class="link-row">${links}</div>`;
    }

    function renderPrivacy(page) {
      return `
        <p class="eyebrow">${escapeHtml(page.eyebrow)}</p>
        <h1>${escapeHtml(page.title)}</h1>
        <p class="updated">${escapeHtml(page.updated)}</p>
        <p class="intro">${escapeHtml(page.intro)}</p>
        <section class="notice"><h2>${escapeHtml(page.noticeTitle)}</h2><p>${escapeHtml(page.noticeBody)}</p></section>
        ${page.sections.map((section) => `<section><h2>${escapeHtml(section.title)}</h2>${paragraphList(section.body)}</section>`).join('')}
        ${renderLinks(page)}
      `;
    }

    function renderSupport(page) {
      return `
        <p class="eyebrow">${escapeHtml(page.eyebrow)}</p>
        <h1>${escapeHtml(page.title)}</h1>
        <p class="intro">${escapeHtml(page.intro)}</p>
        <p class="contact"><strong>${escapeHtml(page.contactLabel)}</strong> <a href="mailto:${escapeHtml(page.contactEmail)}">${escapeHtml(page.contactEmail)}</a></p>
        ${page.sections.map((section) => `<section><h2>${escapeHtml(section.title)}</h2>${paragraphList(section.body)}</section>`).join('')}
        <section><h2>${escapeHtml(page.faqTitle)}</h2>${page.faq.map((item) => `<div class="faq-item"><h3>${escapeHtml(item[0])}</h3><p>${escapeHtml(item[1])}</p></div>`).join('')}</section>
        ${renderLinks(page)}
      `;
    }

    function renderAge(page) {
      const rows = page.rows.map((row) => `<tr><td>${escapeHtml(row[0])}</td><td>${escapeHtml(row[1])}</td></tr>`).join('');
      return `
        <p class="eyebrow">${escapeHtml(page.eyebrow)}</p>
        <h1>${escapeHtml(page.title)}</h1>
        <p class="intro">${escapeHtml(page.intro)}</p>
        <span class="rating">${escapeHtml(page.rating)}</span>
        <table><thead><tr><th>${escapeHtml(page.headers[0])}</th><th>${escapeHtml(page.headers[1])}</th></tr></thead><tbody>${rows}</tbody></table>
        ${page.sections.map((section) => `<section><h2>${escapeHtml(section.title)}</h2>${paragraphList(section.body)}</section>`).join('')}
        ${renderLinks(page)}
      `;
    }

    function render(code) {
      const language = data.languages.find((item) => item.code === code) || data.languages.find((item) => item.code === data.defaultLanguage);
      const page = data.content[language.code];
      const ui = data.ui[language.code];
      document.documentElement.lang = language.htmlLang;
      document.documentElement.dir = language.dir;
      document.title = page.documentTitle;
      const meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', page.metaDescription);
      document.querySelector('.brand span:last-child').textContent = page.brand;
      label.textContent = ui.language;
      select.setAttribute('aria-label', ui.chooseLanguage);
      navItems.forEach((item) => { item.textContent = ui[item.dataset.nav]; });
      content.innerHTML = data.pageType === 'privacy' ? renderPrivacy(page) : (data.pageType === 'support' ? renderSupport(page) : renderAge(page));
      select.value = language.code;
      localStorage.setItem(storageKey, language.code);
    }

    data.languages.forEach((item) => {
      const option = document.createElement('option');
      option.value = item.code;
      option.textContent = item.label;
      select.appendChild(option);
    });
    select.addEventListener('change', () => render(select.value));
    render(preferredLanguage());

  </script>
