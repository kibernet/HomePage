<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flyby 支持</title>
  <meta name="description" content="Flyby 支持页面。">
  <style>
    :root{color-scheme:dark light;--bg:#0b1020;--panel:rgba(14,22,38,.82);--card:rgba(255,255,255,.08);--text:#f8fafc;--muted:#cbd5e1;--line:rgba(148,163,184,.24);--accent:#67e8f9;--shadow:rgba(0,0,0,.34)}
    @media(prefers-color-scheme:light){:root{--bg:#f7fbff;--panel:rgba(255,255,255,.9);--card:rgba(241,245,249,.78);--text:#0f172a;--muted:#334155;--line:rgba(15,23,42,.14);--accent:#0e7490;--shadow:rgba(15,23,42,.12)}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;line-height:1.65;color:var(--text);background:radial-gradient(circle at 18% 0%,rgba(103,232,249,.22),transparent 34rem),radial-gradient(circle at 92% 8%,rgba(255,75,165,.18),transparent 30rem),linear-gradient(135deg,var(--bg),#111827 54%,#07111d)}
    .page{width:min(960px,calc(100% - 40px));margin:0 auto;padding:56px 0}.document{position:relative;padding:clamp(24px,5vw,52px);border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 28px 90px var(--shadow);backdrop-filter:blur(24px)}
    .language{position:absolute;top:20px;right:20px}select{max-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--card);font:inherit;font-size:.92rem}
    h1,h2,h3{line-height:1.15;letter-spacing:0}h1{margin:0 0 10px;font-size:clamp(2.1rem,5vw,3.6rem);font-weight:760}h2{margin:32px 0 14px;font-size:1.22rem}h3{margin:20px 0 8px;font-size:1rem}p,li{color:var(--muted);font-size:1rem}a{color:var(--accent)}ul{padding-left:1.25rem}.eyebrow{margin:0 0 26px;color:var(--accent);font-weight:700;padding-right:190px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:24px 0}.card,.faq{padding:17px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.card strong{display:block;margin-bottom:6px;color:var(--text)}.pill{display:inline-flex;margin:8px 8px 0 0;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
    @media(max-width:640px){.language{position:static;margin:0 0 24px}.eyebrow{padding-right:0}select{width:100%;max-width:none}}
  </style>
</head>
<body>
  <div class="page"><main class="document">
    <div class="language"><select id="language-select" aria-label="选择语言"></select></div>
    <p class="eyebrow" data-i18n="eyebrow">Flyby for Mac</p><h1 data-i18n="title">支持</h1><p data-i18n="intro">如果你在使用 Flyby 时需要帮助，请通过邮件联系我们。</p>
    <div class="cards"><div class="card"><strong data-i18n="emailLabel">邮箱</strong><a href="mailto:kibernet@sina.com">kibernet@sina.com</a></div><div class="card"><strong data-i18n="appLabel">应用</strong><span>Flyby for Mac</span></div><div class="card"><strong data-i18n="categoryLabel">类别</strong><span data-i18n="categoryValue">效率工具</span></div></div>
    <h2 data-i18n="includeTitle">建议提供的信息</h2><ul id="include-list"></ul>
    <h2 data-i18n="faqTitle">常见问题</h2><div id="faq"></div>
    <h2 data-i18n="linksTitle">相关链接</h2><p><span class="pill"><a href="../Privacy/index.html" data-i18n="privacyLink">隐私政策</a></span><span class="pill"><a href="../AgeRating/index.html" data-i18n="ageLink">适龄说明</a></span></p>
  </main></div>
  <script>
    const labels={"zh-Hans":"简体中文","zh-Hant":"繁體中文","en":"English","ja":"日本語","ko":"한국어","es":"Español","fr":"Français","de":"Deutsch"};
    const T={
      "zh-Hans":{docTitle:"Flyby 支持",selectLabel:"选择语言",eyebrow:"Flyby for Mac",title:"支持",intro:"如果你在使用 Flyby 时需要帮助，请通过邮件联系我们。",emailLabel:"邮箱",appLabel:"应用",categoryLabel:"类别",categoryValue:"效率工具",includeTitle:"建议提供的信息",include:["macOS 版本和 Mac 型号。","Flyby 应用版本。","日历权限状态，以及是否能在系统设置中看到 Flyby。","提醒时间、会议筛选、所选日历和你期望提醒出现的会议时间。","可见错误信息或截图，但请不要发送敏感日历内容。"],faqTitle:"常见问题",faqs:[["为什么没有提醒？","请确认已授予完整日历权限、Flyby 已启用、所选日历包含该事件，并且事件时间符合提醒提前时间。"],["Flyby 会上传我的日历吗？","不会。Flyby 只在 Mac 本地读取日历事件。"],["可以只提醒会议吗？","可以。在设置中把会议筛选切换为“仅会议”。"],["如何测试动效？","在菜单栏或设置窗口点击“测试飞行动效”。"]],linksTitle:"相关链接",privacyLink:"隐私政策",ageLink:"适龄说明"},
      "zh-Hant":{docTitle:"Flyby 支援",selectLabel:"選擇語言",eyebrow:"Flyby for Mac",title:"支援",intro:"如果你在使用 Flyby 時需要協助，請透過電子郵件聯絡我們。",emailLabel:"電子郵件",appLabel:"App",categoryLabel:"類別",categoryValue:"效率工具",includeTitle:"建議提供的資訊",include:["macOS 版本和 Mac 型號。","Flyby App 版本。","行事曆權限狀態，以及是否能在系統設定中看到 Flyby。","提醒時間、會議篩選、所選行事曆和你預期提醒出現的會議時間。","可見錯誤訊息或截圖，但請不要傳送敏感行事曆內容。"],faqTitle:"常見問題",faqs:[["為什麼沒有提醒？","請確認已授予完整行事曆權限、Flyby 已啟用、所選行事曆包含該事件，且事件時間符合提醒提前時間。"],["Flyby 會上傳我的行事曆嗎？","不會。Flyby 只在 Mac 本機讀取行事曆事件。"],["可以只提醒會議嗎？","可以。在設定中將會議篩選切換為「僅會議」。"],["如何測試動效？","在選單列或設定視窗點擊「測試飛行」。"]],linksTitle:"相關連結",privacyLink:"隱私權政策",ageLink:"適齡說明"},
      "en":{docTitle:"Flyby Support",selectLabel:"Choose language",eyebrow:"Flyby for Mac",title:"Support",intro:"If you need help with Flyby, contact us by email.",emailLabel:"Email",appLabel:"App",categoryLabel:"Category",categoryValue:"Productivity",includeTitle:"Helpful details to include",include:["Your macOS version and Mac model.","Your Flyby app version.","Calendar permission status and whether Flyby appears in System Settings.","Reminder lead time, meeting filter, selected calendars, and the meeting time you expected to be reminded about.","Visible error messages or screenshots, but do not send sensitive calendar content."],faqTitle:"FAQ",faqs:[["Why did no reminder appear?","Confirm full Calendar access, Flyby enabled, the selected calendar includes the event, and the event matches the reminder lead time."],["Does Flyby upload my calendar?","No. Flyby reads calendar events locally on your Mac."],["Can it remind only for meetings?","Yes. Change Meeting Filter to Meetings Only in settings."],["How do I test the animation?","Click Test Flight in the menu bar or settings window."]],linksTitle:"Links",privacyLink:"Privacy Policy",ageLink:"Age Rating"},
      "ja":{docTitle:"Flyby サポート",selectLabel:"言語を選択",eyebrow:"Flyby for Mac",title:"サポート",intro:"Flyby についてサポートが必要な場合はメールでお問い合わせください。",emailLabel:"メール",appLabel:"アプリ",categoryLabel:"カテゴリ",categoryValue:"仕事効率化",includeTitle:"含めると役立つ情報",include:["macOS バージョンと Mac モデル。","Flyby のアプリバージョン。","カレンダー権限の状態と、システム設定に Flyby が表示されるか。","通知の事前時間、会議フィルター、選択したカレンダー、通知を期待した会議時刻。","表示されたエラーやスクリーンショット。機密のカレンダー内容は送らないでください。"],faqTitle:"よくある質問",faqs:[["通知が表示されないのはなぜですか？","完全なカレンダーアクセス、Flyby の有効化、選択カレンダー内のイベント、通知の事前時間を確認してください。"],["Flyby はカレンダーをアップロードしますか？","いいえ。Flyby は Mac 上でローカルに読み取ります。"],["会議だけ通知できますか？","はい。設定で会議フィルターを「会議のみ」に変更してください。"],["アニメーションをテストするには？","メニューバーまたは設定で Test Flight をクリックします。"]],linksTitle:"リンク",privacyLink:"プライバシーポリシー",ageLink:"年齢区分"},
      "ko":{docTitle:"Flyby 지원",selectLabel:"언어 선택",eyebrow:"Flyby for Mac",title:"지원",intro:"Flyby 사용 중 도움이 필요하면 이메일로 문의하세요.",emailLabel:"이메일",appLabel:"앱",categoryLabel:"카테고리",categoryValue:"생산성",includeTitle:"포함하면 좋은 정보",include:["macOS 버전과 Mac 모델.","Flyby 앱 버전.","캘린더 권한 상태 및 시스템 설정에 Flyby가 표시되는지.","알림 사전 시간, 회의 필터, 선택한 캘린더, 알림을 기대한 회의 시간.","오류 메시지나 스크린샷. 민감한 캘린더 내용은 보내지 마세요."],faqTitle:"FAQ",faqs:[["알림이 표시되지 않는 이유는?","전체 캘린더 접근, Flyby 활성화, 선택 캘린더의 이벤트, 알림 사전 시간을 확인하세요."],["Flyby가 캘린더를 업로드하나요?","아니요. Flyby는 Mac에서 로컬로 읽습니다."],["회의만 알림 받을 수 있나요?","예. 설정에서 회의 필터를 회의만으로 변경하세요."],["애니메이션 테스트는 어떻게 하나요?","메뉴 막대 또는 설정 창에서 Test Flight를 클릭하세요."]],linksTitle:"링크",privacyLink:"개인정보 처리방침",ageLink:"연령 등급"},
      "es":{docTitle:"Soporte de Flyby",selectLabel:"Elegir idioma",eyebrow:"Flyby para Mac",title:"Soporte",intro:"Si necesitas ayuda con Flyby, contáctanos por correo.",emailLabel:"Correo",appLabel:"App",categoryLabel:"Categoría",categoryValue:"Productividad",includeTitle:"Información útil",include:["Versión de macOS y modelo de Mac.","Versión de Flyby.","Estado del permiso de Calendario y si Flyby aparece en Ajustes del Sistema.","Tiempo de aviso, filtro de reuniones, calendarios seleccionados y hora esperada.","Errores o capturas, sin contenido sensible del calendario."],faqTitle:"Preguntas frecuentes",faqs:[["¿Por qué no apareció el recordatorio?","Confirma acceso completo a Calendario, Flyby activado, calendario seleccionado y tiempo de aviso."],["¿Flyby sube mi calendario?","No. Flyby lee los eventos localmente en tu Mac."],["¿Puede avisar solo de reuniones?","Sí. Cambia el filtro a Solo reuniones."],["¿Cómo pruebo la animación?","Haz clic en Test Flight en la barra de menús o ajustes."]],linksTitle:"Enlaces",privacyLink:"Privacidad",ageLink:"Edad recomendada"},
      "fr":{docTitle:"Assistance Flyby",selectLabel:"Choisir la langue",eyebrow:"Flyby pour Mac",title:"Assistance",intro:"Si vous avez besoin d'aide avec Flyby, contactez-nous par e-mail.",emailLabel:"E-mail",appLabel:"App",categoryLabel:"Catégorie",categoryValue:"Productivité",includeTitle:"Informations utiles",include:["Version de macOS et modèle du Mac.","Version de Flyby.","État de l'autorisation Calendrier et présence de Flyby dans Réglages Système.","Délai de rappel, filtre, calendriers sélectionnés et heure attendue.","Messages d'erreur ou captures, sans contenu de calendrier sensible."],faqTitle:"FAQ",faqs:[["Pourquoi aucun rappel n'apparaît ?","Vérifiez l'accès complet au Calendrier, Flyby activé, le calendrier sélectionné et le délai de rappel."],["Flyby importe-t-il mon calendrier ?","Non. Flyby lit les événements localement sur votre Mac."],["Peut-il rappeler uniquement les réunions ?","Oui. Choisissez Réunions uniquement dans les réglages."],["Comment tester l'animation ?","Cliquez sur Test Flight dans la barre des menus ou les réglages."]],linksTitle:"Liens",privacyLink:"Confidentialité",ageLink:"Âge recommandé"},
      "de":{docTitle:"Flyby Support",selectLabel:"Sprache wählen",eyebrow:"Flyby für Mac",title:"Support",intro:"Wenn Sie Hilfe mit Flyby benötigen, kontaktieren Sie uns per E-Mail.",emailLabel:"E-Mail",appLabel:"App",categoryLabel:"Kategorie",categoryValue:"Produktivität",includeTitle:"Hilfreiche Angaben",include:["macOS-Version und Mac-Modell.","Flyby-App-Version.","Kalenderberechtigung und ob Flyby in den Systemeinstellungen erscheint.","Vorlaufzeit, Meeting-Filter, ausgewählte Kalender und erwartete Meeting-Zeit.","Fehler oder Screenshots, aber keine sensiblen Kalenderinhalte."],faqTitle:"FAQ",faqs:[["Warum erschien keine Erinnerung?","Prüfen Sie vollständigen Kalenderzugriff, aktiviertes Flyby, ausgewählten Kalender und Vorlaufzeit."],["Lädt Flyby meinen Kalender hoch?","Nein. Flyby liest Ereignisse lokal auf Ihrem Mac."],["Kann es nur an Meetings erinnern?","Ja. Wählen Sie in den Einstellungen Nur Meetings."],["Wie teste ich die Animation?","Klicken Sie in Menüleiste oder Einstellungen auf Test Flight."]],linksTitle:"Links",privacyLink:"Datenschutz",ageLink:"Altersfreigabe"}
    };
    const params=new URLSearchParams(location.search);const lang=T[params.get("lang")]?params.get("lang"):"zh-Hans";const c=T[lang];document.documentElement.lang=lang;document.title=c.docTitle;document.querySelector("meta[name='description']").content=c.docTitle;
    const select=document.getElementById("language-select");Object.entries(labels).forEach(([v,l])=>select.add(new Option(l,v)));select.value=lang;select.setAttribute("aria-label",c.selectLabel);select.onchange=()=>{location.href=select.value==="zh-Hans"?location.pathname:`${location.pathname}?lang=${select.value}`};
    document.querySelectorAll("[data-i18n]").forEach(n=>n.innerHTML=c[n.dataset.i18n]);document.getElementById("include-list").innerHTML=c.include.map(x=>`<li>${x}</li>`).join("");document.getElementById("faq").innerHTML=c.faqs.map(([q,a])=>`<section class="faq"><h3>${q}</h3><p>${a}</p></section>`).join("");
  </script>
</body>
</html>
