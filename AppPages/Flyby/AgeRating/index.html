    <h2 data-i18n="privacyTitle">隐私与安全</h2><p data-i18n="privacyBody">Flyby 不需要账号，不包含广告或追踪 SDK，不上传日历数据。隐私政策请查看：<a href="../Privacy/index.html">隐私政策</a>。</p>
