    "content":{
      "zh-Hans":{"metaTitle":"SoulChord 支持","metaDescription":"SoulChord（时光节拍器）使用帮助与故障排除。","eyebrow":"SoulChord / 时光节拍器","title":"支持","updated":"适用于版本 1.0.0","intro":"SoulChord 为 iPhone、iPad 和 Mac 提供节拍器、调音器、节奏监听、触感和可选闪光反馈。","summary":"需要帮助？请发送邮件至 kibernet@sina.com，并注明平台、系统版本、App 版本、问题步骤和你已尝试的方法。","startTitle":"快速开始","steps":["在节拍器中选择速度、拍号、细分、音色和外观，然后点按播放。","打开调音器，按提示允许麦克风访问，再靠近乐器演奏稳定音高。","需要节奏落点反馈时开启监听；练习摘要仅保存在本机。","在支持的 iPhone 上主动开启闪光同步后，允许相机权限以使用后置闪光灯。"],"faqTitle":"常见问题","faqs":[["听不到节拍怎么办？","检查设备音量和静音状态，确认没有其他 App 独占音频；断开并重新连接蓝牙或外接音频设备后重试。"],["调音器或节奏监听没有反应？","在系统设置中允许 SoulChord 使用麦克风，回到 App 后重新开始监听。远离持续噪声，并让乐器靠近麦克风。"],["闪光同步不可用？","此功能需要带后置闪光灯的 iPhone。请在系统设置中允许相机权限；iPad 和 Mac 可能不提供此功能。"],["蓝牙节拍感觉延迟？","无线音频可能产生系统级延迟。需要精确练习时建议使用设备扬声器或有线音频。"],["后台播放停止？","确认节拍器已经开始播放。来电、Siri、音频路由变化或其他 App 可能中断音频；返回 SoulChord 后重新开始。"],["如何重置本机数据？","可在 App 内清除练习报告或调整设置；删除 App 会移除其本机数据。"]],"contactTitle":"联系支持","contactBody":"邮箱：kibernet@sina.com。请不要发送密码、私钥、机密文件或不必要的私人录音。","linksTitle":"相关页面"},
      "zh-Hant":{"metaTitle":"SoulChord 支援","metaDescription":"SoulChord（時光節拍器）使用說明與疑難排解。","eyebrow":"SoulChord / 時光節拍器","title":"支援","updated":"適用於版本 1.0.0","intro":"SoulChord 為 iPhone、iPad 與 Mac 提供節拍器、調音器、節奏聆聽、觸覺和可選的閃光回饋。","summary":"需要協助？請寄信至 kibernet@sina.com，並註明平台、系統版本、App 版本、重現步驟及已嘗試的方法。","startTitle":"快速開始","steps":["在節拍器選擇速度、拍號、細分、音色和外觀，然後點按播放。","開啟調音器，允許麥克風存取，再靠近樂器演奏穩定音高。","需要節奏落點回饋時開啟聆聽；練習摘要只保存在本機。","在支援的 iPhone 主動開啟閃光同步後，允許相機權限以使用後置閃光燈。"],"faqTitle":"常見問題","faqs":[["聽不到節拍？","檢查裝置音量與靜音狀態，確認其他 App 未獨佔音訊；重新連接藍牙或外接音訊裝置後再試。"],["調音器或節奏聆聽沒有反應？","在系統設定允許 SoulChord 使用麥克風，返回 App 後重新開始。遠離持續噪音並靠近麥克風。"],["閃光同步不可用？","需要有後置閃光燈的 iPhone。請允許相機權限；iPad 和 Mac 可能不提供。"],["藍牙有延遲？","無線音訊可能產生系統延遲。精確練習建議使用裝置揚聲器或有線音訊。"],["背景播放停止？","來電、Siri、音訊路由改變或其他 App 可能中斷。返回 SoulChord 後重新開始。"],["如何重設資料？","可在 App 內清除練習報告；刪除 App 會移除本機資料。"]],"contactTitle":"聯絡支援","contactBody":"電子郵件：kibernet@sina.com。請勿傳送密碼、私鑰、機密檔案或不必要的私人錄音。","linksTitle":"相關頁面"},
      "en":{"metaTitle":"SoulChord Support","metaDescription":"Support and troubleshooting for SoulChord on iPhone, iPad, and Mac.","eyebrow":"SoulChord","title":"Support","updated":"For version 1.0.0","intro":"SoulChord provides a metronome, tuner, rhythm listening, haptics, and optional flash feedback on iPhone, iPad, and Mac.","summary":"Need help? Email kibernet@sina.com with your platform, OS version, app version, steps to reproduce, and troubleshooting already attempted.","startTitle":"Quick start","steps":["In Metronome, choose tempo, time signature, subdivision, voice, and appearance, then press Play.","Open Tuner, allow microphone access when prompted, and play a steady note near the device.","Enable listening when you want rhythm-onset feedback. Practice summaries remain on the device.","On a supported iPhone, enable Flash Sync and allow camera permission to use the rear torch."],"faqTitle":"Frequently asked questions","faqs":[["I cannot hear the click. What should I do?","Check device volume and mute state, and make sure another app is not holding the audio route. Disconnect and reconnect Bluetooth or external audio, then try again."],["The tuner or rhythm listening does not respond.","Allow microphone access for SoulChord in system settings, return to the app, and start listening again. Reduce steady background noise and move the instrument closer."],["Flash Sync is unavailable.","Flash Sync requires an iPhone with a rear torch. Allow camera access in system settings. The feature may not be available on iPad or Mac."],["Bluetooth feels late.","Wireless audio can add system-level latency. For precision practice, use the device speaker or a wired audio route."],["Background playback stopped.","Calls, Siri, route changes, or another app can interrupt audio. Return to SoulChord and restart the metronome."],["How do I reset local data?","Clear practice reports or adjust preferences in the app. Deleting the app removes its locally stored data."]],"contactTitle":"Contact support","contactBody":"Email: kibernet@sina.com. Do not send passwords, private keys, confidential files, or unnecessary private recordings.","linksTitle":"Related pages"},
      "ja":{"metaTitle":"SoulChord サポート","metaDescription":"SoulChord の使い方とトラブルシューティング。","eyebrow":"SoulChord","title":"サポート","updated":"バージョン 1.0.0 対応","intro":"SoulChord は iPhone、iPad、Mac でメトロノーム、チューナー、リズム聴取、触覚、任意のフラッシュフィードバックを提供します。","summary":"お問い合わせは kibernet@sina.com へ。端末、OS、App バージョン、再現手順、試した対処を記載してください。","startTitle":"クイックスタート","steps":["メトロノームでテンポ、拍子、細分、音色、外観を選び、再生します。","チューナーを開き、マイクを許可して、端末の近くで安定した音を鳴らします。","タイミングのフィードバックが必要なときに聴取を有効にします。概要は端末内に残ります。","対応 iPhone でフラッシュ同期を有効にし、背面ライト用のカメラ権限を許可します。"],"faqTitle":"よくある質問","faqs":[["クリック音が聞こえません。","音量と消音を確認し、Bluetooth または外部音声を再接続してください。"],["チューナーが反応しません。","システム設定でマイクを許可し、App に戻って再開してください。雑音を減らし、楽器を近づけます。"],["フラッシュ同期が使えません。","背面ライト付き iPhone が必要です。カメラ権限を許可してください。iPad と Mac では利用できない場合があります。"],["Bluetooth が遅れます。","無線音声には遅延があります。正確な練習には本体スピーカーまたは有線音声を推奨します。"],["バックグラウンド再生が止まりました。","通話、Siri、経路変更などで中断されます。App に戻って再開してください。"],["ローカルデータを消すには？","練習レポートを消去できます。App の削除でローカルデータも削除されます。"]],"contactTitle":"お問い合わせ","contactBody":"kibernet@sina.com。パスワード、秘密鍵、機密ファイル、不要な録音は送信しないでください。","linksTitle":"関連ページ"},
      "ko":{"metaTitle":"SoulChord 지원","metaDescription":"SoulChord 사용 및 문제 해결 안내입니다.","eyebrow":"SoulChord","title":"지원","updated":"버전 1.0.0 기준","intro":"SoulChord는 iPhone, iPad 및 Mac에서 메트로놈, 튜너, 리듬 듣기, 햅틱 및 선택적 플래시 피드백을 제공합니다.","summary":"도움이 필요하면 플랫폼, OS, 앱 버전, 재현 단계 및 시도한 방법과 함께 kibernet@sina.com으로 문의하세요.","startTitle":"빠른 시작","steps":["메트로놈에서 템포, 박자표, 분할, 음색과 외관을 선택한 후 재생합니다.","튜너를 열고 마이크를 허용한 뒤 기기 가까이에서 안정된 음을 연주합니다.","리듬 타이밍 피드백이 필요할 때 듣기를 켭니다. 연습 요약은 기기에 저장됩니다.","지원되는 iPhone에서 플래시 동기화를 켜고 후면 플래시 사용을 위해 카메라를 허용합니다."],"faqTitle":"자주 묻는 질문","faqs":[["클릭 소리가 들리지 않습니다.","볼륨과 무음 상태를 확인하고 Bluetooth 또는 외부 오디오를 다시 연결하세요."],["튜너가 반응하지 않습니다.","시스템 설정에서 마이크를 허용하고 앱에서 다시 시작하세요. 배경 소음을 줄이고 악기를 가까이 두세요."],["플래시 동기화를 사용할 수 없습니다.","후면 플래시가 있는 iPhone이 필요합니다. 카메라 권한을 허용하세요. iPad와 Mac에서는 제공되지 않을 수 있습니다."],["Bluetooth가 늦게 들립니다.","무선 오디오는 지연될 수 있습니다. 정밀 연습에는 기기 스피커나 유선을 사용하세요."],["백그라운드 재생이 멈췄습니다.","통화, Siri 또는 오디오 경로 변경으로 중단될 수 있습니다. 앱에서 다시 시작하세요."],["로컬 데이터를 초기화하려면?","연습 보고서를 지우거나 앱을 삭제해 로컬 데이터를 제거할 수 있습니다."]],"contactTitle":"지원 문의","contactBody":"kibernet@sina.com. 비밀번호, 개인 키, 기밀 파일 또는 불필요한 개인 녹음을 보내지 마세요.","linksTitle":"관련 페이지"},
      "es":{"metaTitle":"Soporte de SoulChord","metaDescription":"Ayuda y solución de problemas de SoulChord.","eyebrow":"SoulChord","title":"Soporte","updated":"Para la versión 1.0.0","intro":"SoulChord ofrece metrónomo, afinador, escucha rítmica, háptica y flash opcional en iPhone, iPad y Mac.","summary":"Escribe a kibernet@sina.com indicando plataforma, versión del sistema y de la app, pasos y soluciones ya probadas.","startTitle":"Inicio rápido","steps":["Elige tempo, compás, subdivisión, voz y aspecto en Metrónomo, y pulsa reproducir.","Abre Afinador, permite el micrófono y toca una nota estable cerca del dispositivo.","Activa la escucha para recibir información de tiempo. Los resúmenes quedan en el dispositivo.","En un iPhone compatible, activa Flash Sync y permite la cámara para usar la linterna trasera."],"faqTitle":"Preguntas frecuentes","faqs":[["No oigo el clic.","Comprueba volumen y silencio, y reconecta Bluetooth o audio externo."],["El afinador no responde.","Permite el micrófono en los ajustes, vuelve a la app y reinicia la escucha. Reduce el ruido continuo."],["Flash Sync no está disponible.","Requiere un iPhone con linterna trasera y permiso de cámara. Puede no estar disponible en iPad o Mac."],["Bluetooth tiene retraso.","El audio inalámbrico añade latencia. Usa el altavoz del dispositivo o audio por cable para practicar con precisión."],["La reproducción en segundo plano se detuvo.","Llamadas, Siri o cambios de ruta pueden interrumpirla. Vuelve a SoulChord y reinicia."],["¿Cómo borro datos locales?","Borra informes en la app o elimina la app para retirar sus datos locales."]],"contactTitle":"Contactar","contactBody":"kibernet@sina.com. No envíes contraseñas, claves privadas, archivos confidenciales ni grabaciones innecesarias.","linksTitle":"Páginas relacionadas"},
      "fr":{"metaTitle":"Assistance SoulChord","metaDescription":"Aide et dépannage pour SoulChord.","eyebrow":"SoulChord","title":"Assistance","updated":"Pour la version 1.0.0","intro":"SoulChord propose métronome, accordeur, écoute rythmique, haptique et flash facultatif sur iPhone, iPad et Mac.","summary":"Écrivez à kibernet@sina.com avec la plateforme, les versions du système et de l'app, les étapes et les essais déjà effectués.","startTitle":"Démarrage rapide","steps":["Choisissez tempo, mesure, subdivision, son et apparence dans Métronome, puis lancez la lecture.","Ouvrez l'accordeur, autorisez le micro et jouez une note stable près de l'appareil.","Activez l'écoute pour le retour de timing. Les résumés restent sur l'appareil.","Sur un iPhone compatible, activez Flash Sync et autorisez la caméra pour la torche arrière."],"faqTitle":"Questions fréquentes","faqs":[["Je n'entends pas le clic.","Vérifiez le volume et le mode silencieux, puis reconnectez le Bluetooth ou l'audio externe."],["L'accordeur ne réagit pas.","Autorisez le micro dans les réglages, revenez dans l'app et relancez l'écoute. Réduisez le bruit ambiant."],["Flash Sync est indisponible.","Il faut un iPhone avec torche arrière et l'autorisation caméra. La fonction peut manquer sur iPad ou Mac."],["Le Bluetooth semble en retard.","L'audio sans fil ajoute de la latence. Utilisez le haut-parleur ou une connexion filaire pour la précision."],["La lecture en arrière-plan s'est arrêtée.","Un appel, Siri ou un changement de sortie peut interrompre l'audio. Revenez dans SoulChord et relancez."],["Comment effacer les données locales ?","Effacez les rapports dans l'app ou supprimez l'app pour retirer les données locales."]],"contactTitle":"Contacter l'assistance","contactBody":"kibernet@sina.com. N'envoyez pas de mots de passe, clés privées, fichiers confidentiels ou enregistrements inutiles.","linksTitle":"Pages associées"},
      "de":{"metaTitle":"SoulChord Support","metaDescription":"Hilfe und Fehlerbehebung für SoulChord.","eyebrow":"SoulChord","title":"Support","updated":"Für Version 1.0.0","intro":"SoulChord bietet Metronom, Stimmgerät, Rhythmus-Hören, Haptik und optionales Blitzfeedback auf iPhone, iPad und Mac.","summary":"Schreiben Sie an kibernet@sina.com und nennen Sie Plattform, System- und App-Version, Schritte und bereits versuchte Lösungen.","startTitle":"Schnellstart","steps":["Wählen Sie Tempo, Taktart, Unterteilung, Klang und Darstellung und starten Sie die Wiedergabe.","Öffnen Sie das Stimmgerät, erlauben Sie das Mikrofon und spielen Sie nahe am Gerät einen stabilen Ton.","Aktivieren Sie das Hören für Timing-Feedback. Übungszusammenfassungen bleiben auf dem Gerät.","Aktivieren Sie auf einem unterstützten iPhone Flash Sync und erlauben Sie die Kamera für die rückseitige Lampe."],"faqTitle":"Häufige Fragen","faqs":[["Ich höre keinen Klick.","Prüfen Sie Lautstärke und Stummschaltung und verbinden Sie Bluetooth oder externe Audiogeräte neu."],["Das Stimmgerät reagiert nicht.","Erlauben Sie das Mikrofon in den Systemeinstellungen und starten Sie das Hören erneut. Verringern Sie Dauergeräusche."],["Flash Sync ist nicht verfügbar.","Erfordert ein iPhone mit rückseitiger Lampe und Kameraberechtigung. Auf iPad oder Mac ist die Funktion möglicherweise nicht verfügbar."],["Bluetooth wirkt verzögert.","Drahtloses Audio kann Latenz verursachen. Nutzen Sie für präzises Üben Lautsprecher oder Kabel."],["Hintergrundwiedergabe wurde beendet.","Anrufe, Siri oder Routenwechsel können Audio unterbrechen. Starten Sie das Metronom erneut."],["Wie lösche ich lokale Daten?","Löschen Sie Berichte in der App oder entfernen Sie die App samt lokalen Daten."]],"contactTitle":"Support kontaktieren","contactBody":"kibernet@sina.com. Senden Sie keine Passwörter, privaten Schlüssel, vertraulichen Dateien oder unnötigen privaten Aufnahmen.","linksTitle":"Verwandte Seiten"}
    }

  <script>
    (()=>{const d=JSON.parse(document.getElementById('page-data').textContent),s=document.getElementById('language-select'),c=document.getElementById('content'),key='soulchord-page-language';const norm=v=>{if(!v)return'';v=v.toLowerCase();if(v==='zh'||v.startsWith('zh-cn')||v.startsWith('zh-sg')||v.includes('hans'))return'zh-Hans';if(v.startsWith('zh-tw')||v.startsWith('zh-hk')||v.startsWith('zh-mo')||v.includes('hant'))return'zh-Hant';const b=v.split(/[-_]/)[0];return d.languages.find(x=>x.code.toLowerCase()===v||x.htmlLang.toLowerCase()===v||x.code.toLowerCase().split('-')[0]===b)?.code||''};const pick=()=>{const h=norm(location.hash.slice(1));if(h)return h;try{const x=norm(localStorage.getItem(key));if(x)return x}catch{}for(const x of navigator.languages||[navigator.language]){const n=norm(x);if(n)return n}return d.defaultLanguage};const render=code=>{const lang=d.languages.find(x=>x.code===code)||d.languages.find(x=>x.code===d.defaultLanguage),u=d.ui[lang.code],x=d.content[lang.code];document.documentElement.lang=lang.htmlLang;document.documentElement.dir=lang.dir;document.title=x.metaTitle;document.querySelector('meta[name=description]').content=x.metaDescription;document.getElementById('language-label').textContent=u.language;s.setAttribute('aria-label',u.chooseLanguage);document.getElementById('nav-privacy').textContent=u.privacy;document.getElementById('nav-support').textContent=u.support;document.getElementById('nav-age').textContent=u.age;s.value=lang.code;document.querySelectorAll('nav a,.brand').forEach(a=>{const b=a.getAttribute('href').split('#')[0];a.href=lang.code===d.defaultLanguage?b:`${b}#${lang.code}`});c.replaceChildren();const add=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;c.append(e);return e};add('p',x.eyebrow,'eyebrow');add('h1',x.title);add('p',x.updated,'updated');add('p',x.intro,'intro');const n=document.createElement('div');n.className='notice';const p=document.createElement('p');p.textContent=x.summary;n.append(p);c.append(n);add('h2',x.startTitle);const ol=document.createElement('ol');ol.className='steps';x.steps.forEach(t=>{const li=document.createElement('li');li.textContent=t;ol.append(li)});c.append(ol);add('h2',x.faqTitle);x.faqs.forEach(([q,a])=>{add('h3',q);add('p',a)});add('h2',x.contactTitle);add('p',x.contactBody);add('h2',x.linksTitle);const row=document.createElement('div');row.className='links';[[u.privacy,'../Privacy/index.html'],[u.age,'../AgeRating/index.html']].forEach(([t,h])=>{const a=document.createElement('a');a.className='pill';a.textContent=t;a.href=lang.code===d.defaultLanguage?h:`${h}#${lang.code}`;row.append(a)});c.append(row);try{localStorage.setItem(key,lang.code)}catch{}};d.languages.forEach(x=>{const o=document.createElement('option');o.value=x.code;o.textContent=x.label;s.append(o)});s.addEventListener('change',()=>{history.replaceState(null,'',s.value===d.defaultLanguage?location.pathname:`#${s.value}`);render(s.value)});render(pick())})();
  </script>
