  <style>
    :root { color-scheme: light; --bg:#f5f1e9; --paper:#fffdf8; --text:#24282c; --muted:#5f6565; --quiet:#858782; --line:#ddd6ca; --accent:#248d83; --accent2:#a77c39; --soft:#f2eee6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:linear-gradient(135deg,#fffdf8 0%,var(--bg) 55%,#ece5da 100%); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; line-height:1.65; }
    .page { width:min(980px,calc(100% - 32px)); margin:0 auto; padding:32px 0 52px; }
    .shell { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:rgba(255,253,248,.96); box-shadow:0 24px 70px rgba(70,55,35,.12); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:17px 20px; border-bottom:1px solid var(--line); background:rgba(242,238,230,.8); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-weight:760; }
    .mark { display:grid; place-items:center; width:34px; height:34px; border:1px solid #a9d7d1; border-radius:10px; color:var(--accent); background:#edf9f7; font-weight:820; }
    nav { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; }
    nav a,.language { border:1px solid var(--line); border-radius:9px; background:#fffdf8; color:var(--muted); font-size:.93rem; }
    nav a { padding:7px 10px; text-decoration:none; }
    nav a[aria-current="page"] { border-color:#9bcfc9; color:var(--accent); background:#edf9f7; }
    .language { display:flex; align-items:center; gap:7px; padding:6px 8px; }
    .language label { color:var(--quiet); font-size:.86rem; white-space:nowrap; }
    select { min-width:148px; border:0; outline:0; color:var(--text); background:transparent; font:inherit; }
    main { padding:clamp(26px,5vw,52px); }
    h1 { margin:0 0 10px; font-size:clamp(2.1rem,6vw,3.4rem); line-height:1.08; }
    h2 { margin:32px 0 9px; font-size:1.18rem; }
    p,li { color:var(--muted); overflow-wrap:anywhere; }
    .eyebrow { margin:0 0 18px; color:var(--accent); font-weight:760; }
    .updated { color:var(--quiet); font-size:.94rem; }
    .intro { font-size:1.05rem; }
    .notice { margin:23px 0; padding:16px 18px; border:1px solid #bddbd7; border-radius:10px; background:#f0faf8; }
    .notice p { margin:0; }
    a { color:var(--accent); }
    .links { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
    .pill { padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:var(--soft); color:var(--text); text-decoration:none; }
    @media(max-width:720px){ .page{width:min(100% - 20px,980px);padding:12px 0 28px}.topbar{align-items:stretch;flex-direction:column}nav{justify-content:flex-start}.language{width:100%}.language select{width:100%;min-width:0}main{padding:25px 20px} }

    "content":{
      "zh-Hans":{"metaTitle":"SoulChord 隐私政策","metaDescription":"SoulChord（时光节拍器）隐私政策。","eyebrow":"SoulChord / 时光节拍器","title":"隐私政策","updated":"最后更新：2026 年 7 月 12 日","intro":"SoulChord 是一款适用于 iPhone、iPad 和 Mac 的节拍器、调音器与节奏练习工具。本政策说明 App 如何处理你的数据。","summary":"摘要：无需账号；不投放广告；不使用分析或崩溃上报 SDK；不追踪用户；音频分析在设备本地完成。","sections":[["数据收集与网络","当前版本没有账号、云同步、订阅、App 内购买、广告、第三方分析或网络必需功能。App 不会把个人数据、练习记录、设备标识符或音频发送到开发者服务器。"],["本机保存","语言、引导完成状态、节拍器设置、收藏速度、所选外观、练习会话摘要和时间偏移结果使用系统本机存储保存在设备上。你可通过删除 App 或清除相关内容来移除这些数据。"],["麦克风","只有在你启动调音或节奏监听时，App 才请求麦克风权限。音高和落点分析在设备上实时完成；App 不上传或保存原始录音。"],["相机闪光灯","iPhone 上的闪光同步功能会在你主动开启时请求相机权限，仅用于控制后置闪光灯随节拍闪烁。App 不拍摄、保存或上传照片与视频。"],["后台音频与触感","后台音频只用于在练习期间继续播放节拍；触感反馈由设备本地生成。"],["支持邮件","如果你联系支持，我们只会收到你主动发送的信息，例如邮箱地址、问题描述、截图和设备信息。请勿发送密码、私钥、机密文件或私人录音。"]],"contactTitle":"联系与选择","contactBody":"隐私问题请发送邮件至 kibernet@sina.com。你可以在系统设置中随时撤销麦克风或相机权限。"},
      "zh-Hant":{"metaTitle":"SoulChord 隱私權政策","metaDescription":"SoulChord（時光節拍器）隱私權政策。","eyebrow":"SoulChord / 時光節拍器","title":"隱私權政策","updated":"最後更新：2026 年 7 月 12 日","intro":"SoulChord 是適用於 iPhone、iPad 與 Mac 的節拍器、調音器和節奏練習工具。本政策說明 App 如何處理你的資料。","summary":"摘要：無需帳號；沒有廣告；不使用分析或當機回報 SDK；不追蹤使用者；音訊分析在裝置本機完成。","sections":[["資料收集與網路","目前版本沒有帳號、雲端同步、訂閱、App 內購買、廣告、第三方分析或必要的網路功能。App 不會將個人資料、練習記錄、裝置識別碼或音訊傳送到開發者伺服器。"],["本機儲存","語言、導覽完成狀態、節拍器設定、收藏速度、所選外觀、練習摘要及時間偏移結果會使用系統本機儲存保留在裝置上。"],["麥克風","只有在你啟動調音或節奏聆聽時才會要求麥克風權限。音高與落點分析即時在裝置上完成；App 不上傳或保存原始錄音。"],["相機閃光燈","iPhone 的閃光同步功能只在你主動開啟時要求相機權限，且僅用於控制後置閃光燈隨節拍閃爍。App 不拍攝、保存或上傳相片與影片。"],["背景音訊與觸覺","背景音訊僅用於練習期間繼續播放節拍；觸覺回饋在裝置本機產生。"],["支援郵件","如果你聯絡支援，我們只會收到你主動傳送的資訊，例如電子郵件地址、問題描述、截圖及裝置資訊。請勿傳送密碼、私鑰、機密檔案或私人錄音。"]],"contactTitle":"聯絡與選擇","contactBody":"隱私問題請寄信至 kibernet@sina.com。你可隨時在系統設定中撤銷麥克風或相機權限。"},
      "en":{"metaTitle":"SoulChord Privacy Policy","metaDescription":"Privacy policy for SoulChord, a local-first metronome, tuner, and rhythm practice app.","eyebrow":"SoulChord","title":"Privacy Policy","updated":"Last updated: July 12, 2026","intro":"SoulChord is a metronome, tuner, and rhythm-practice utility for iPhone, iPad, and Mac. This policy explains how the app handles data.","summary":"Summary: no account, no ads, no analytics or crash-reporting SDKs, no tracking, and on-device audio analysis.","sections":[["Data collection and networking","The current version has no account, cloud sync, subscription, in-app purchase, advertising, third-party analytics, or network-required core feature. The app does not send personal data, practice history, device identifiers, or audio to developer-operated servers."],["On-device storage","Language, onboarding state, metronome settings, saved tempos, selected appearance, practice-session summaries, and timing-offset results are stored locally with system storage. You can remove this data by clearing relevant content or deleting the app."],["Microphone","The app requests microphone permission only when you start tuning or rhythm listening. Pitch and onset analysis runs in real time on the device. The app does not upload or save raw recordings."],["Camera torch","On iPhone, flash sync requests camera permission only after you enable the feature and uses it solely to pulse the rear torch with the beat. The app does not capture, save, or upload photos or video."],["Background audio and haptics","Background audio is used only to continue metronome playback during practice. Haptic feedback is generated locally by the device."],["Support email","If you contact support, we receive only information you choose to send, such as your email address, issue description, screenshots, and device details. Do not send passwords, private keys, confidential files, or private recordings."]],"contactTitle":"Contact and choices","contactBody":"For privacy questions, email kibernet@sina.com. You can revoke microphone or camera permission at any time in system settings."},
      "ja":{"metaTitle":"SoulChord プライバシーポリシー","metaDescription":"SoulChord のプライバシーポリシー。","eyebrow":"SoulChord","title":"プライバシーポリシー","updated":"最終更新日：2026年7月12日","intro":"SoulChord は iPhone、iPad、Mac 向けのメトロノーム、チューナー、リズム練習ツールです。本ポリシーはデータの取り扱いを説明します。","summary":"概要：アカウント、広告、分析・クラッシュ報告 SDK、追跡はなく、音声解析は端末上で行われます。","sections":[["データ収集と通信","現行版にはアカウント、クラウド同期、サブスクリプション、アプリ内課金、広告、第三者分析、必須のネットワーク機能はありません。個人データ、練習履歴、端末 ID、音声を開発者サーバーへ送信しません。"],["端末内保存","言語、オンボーディング状態、メトロノーム設定、保存テンポ、外観、練習概要、タイミング結果は端末内に保存されます。"],["マイク","チューニングまたはリズム聴取を開始した場合のみ許可を求めます。音高とタイミングの解析は端末上で行い、元の録音を保存・送信しません。"],["カメラのライト","iPhone でフラッシュ同期を有効にした場合だけカメラ許可を求め、背面ライトを拍に合わせる目的にのみ使用します。写真や動画は撮影・保存・送信しません。"],["バックグラウンド音声と触覚","バックグラウンド音声は練習中のメトロノーム再生にのみ使用し、触覚は端末内で生成されます。"],["サポートメール","サポート時は、あなたが送信したメールアドレス、説明、スクリーンショット、端末情報のみを受け取ります。機密情報は送らないでください。"]],"contactTitle":"連絡先と選択","contactBody":"プライバシーに関するお問い合わせは kibernet@sina.com まで。権限はシステム設定からいつでも取り消せます。"},
      "ko":{"metaTitle":"SoulChord 개인정보 처리방침","metaDescription":"SoulChord 개인정보 처리방침입니다.","eyebrow":"SoulChord","title":"개인정보 처리방침","updated":"최종 업데이트: 2026년 7월 12일","intro":"SoulChord는 iPhone, iPad 및 Mac용 메트로놈, 튜너, 리듬 연습 도구입니다. 이 방침은 앱의 데이터 처리 방식을 설명합니다.","summary":"요약: 계정, 광고, 분석/충돌 보고 SDK, 추적이 없으며 오디오 분석은 기기에서 처리됩니다.","sections":[["데이터 수집 및 네트워크","현재 버전에는 계정, 클라우드 동기화, 구독, 인앱 결제, 광고, 타사 분석 또는 필수 네트워크 기능이 없습니다. 개인 데이터, 연습 기록, 기기 식별자나 오디오를 개발자 서버로 보내지 않습니다."],["기기 내 저장","언어, 온보딩 상태, 메트로놈 설정, 저장 템포, 선택한 외관, 연습 요약 및 타이밍 결과는 기기에 로컬로 저장됩니다."],["마이크","튜닝 또는 리듬 듣기를 시작할 때만 마이크 권한을 요청합니다. 음높이와 타이밍 분석은 기기에서 실시간으로 처리되며 원본 녹음을 저장하거나 업로드하지 않습니다."],["카메라 플래시","iPhone에서 플래시 동기화를 켠 경우에만 카메라 권한을 요청하며 후면 플래시를 박자에 맞추는 용도로만 사용합니다. 사진이나 동영상을 촬영, 저장 또는 업로드하지 않습니다."],["백그라운드 오디오와 햅틱","백그라운드 오디오는 연습 중 메트로놈 재생에만 사용되며 햅틱은 기기에서 생성됩니다."],["지원 이메일","지원 문의 시 사용자가 보낸 이메일, 설명, 스크린샷 및 기기 정보만 받습니다. 비밀번호나 기밀 자료를 보내지 마세요."]],"contactTitle":"문의 및 선택","contactBody":"개인정보 문의: kibernet@sina.com. 시스템 설정에서 언제든 권한을 철회할 수 있습니다."},
      "es":{"metaTitle":"Política de privacidad de SoulChord","metaDescription":"Política de privacidad de SoulChord.","eyebrow":"SoulChord","title":"Política de privacidad","updated":"Última actualización: 12 de julio de 2026","intro":"SoulChord es un metrónomo, afinador y herramienta de práctica rítmica para iPhone, iPad y Mac. Esta política explica cómo trata los datos.","summary":"Resumen: sin cuenta, anuncios, SDK de analítica o fallos, ni seguimiento; el audio se analiza en el dispositivo.","sections":[["Datos y red","La versión actual no incluye cuentas, sincronización en la nube, suscripciones, compras dentro de la app, publicidad, analítica de terceros ni funciones esenciales que requieran red. No envía datos personales, historial de práctica, identificadores ni audio a servidores del desarrollador."],["Almacenamiento local","El idioma, estado de introducción, ajustes, tempos guardados, apariencia, resúmenes de práctica y resultados de tiempo se guardan localmente en el dispositivo."],["Micrófono","Solo se solicita al iniciar la afinación o escucha rítmica. El análisis de tono y tiempo ocurre en el dispositivo; no se guardan ni suben grabaciones originales."],["Linterna de la cámara","En iPhone, la sincronización de flash pide permiso solo al activarla y usa la linterna trasera únicamente con el pulso. No captura, guarda ni sube fotos o vídeo."],["Audio en segundo plano y háptica","El audio en segundo plano solo mantiene el metrónomo durante la práctica; la háptica se genera localmente."],["Correo de soporte","Solo recibimos la información que decides enviar, como correo, descripción, capturas y datos del dispositivo. No envíes contraseñas ni material confidencial."]],"contactTitle":"Contacto y opciones","contactBody":"Para privacidad, escribe a kibernet@sina.com. Puedes revocar permisos en los ajustes del sistema."},
      "fr":{"metaTitle":"Politique de confidentialité de SoulChord","metaDescription":"Politique de confidentialité de SoulChord.","eyebrow":"SoulChord","title":"Politique de confidentialité","updated":"Dernière mise à jour : 12 juillet 2026","intro":"SoulChord est un métronome, accordeur et outil de pratique rythmique pour iPhone, iPad et Mac. Cette politique explique le traitement des données.","summary":"Résumé : aucun compte, aucune publicité, aucun SDK d'analyse ou de rapport de plantage, aucun suivi ; l'audio est analysé sur l'appareil.","sections":[["Données et réseau","La version actuelle ne comporte ni compte, ni synchronisation cloud, ni abonnement, ni achat intégré, ni publicité, ni analyse tierce, ni fonction principale nécessitant le réseau. Elle n'envoie pas de données personnelles, d'historique, d'identifiant ou d'audio aux serveurs du développeur."],["Stockage local","La langue, l'état d'accueil, les réglages, tempos enregistrés, apparence, résumés de pratique et résultats de timing restent sur l'appareil."],["Microphone","L'autorisation est demandée uniquement au démarrage de l'accordage ou de l'écoute rythmique. L'analyse est locale ; aucun enregistrement brut n'est sauvegardé ou envoyé."],["Torche de la caméra","Sur iPhone, la synchronisation du flash demande l'autorisation uniquement après activation et utilise seulement la torche arrière avec le tempo. Aucune photo ou vidéo n'est capturée, conservée ou envoyée."],["Audio en arrière-plan et haptique","L'audio en arrière-plan sert uniquement au métronome pendant la pratique ; l'haptique est générée localement."],["E-mail d'assistance","Nous recevons uniquement les informations que vous envoyez : e-mail, description, captures et appareil. N'envoyez pas de mots de passe ni de fichiers confidentiels."]],"contactTitle":"Contact et choix","contactBody":"Questions de confidentialité : kibernet@sina.com. Les autorisations peuvent être retirées dans les réglages système."},
      "de":{"metaTitle":"SoulChord Datenschutzrichtlinie","metaDescription":"Datenschutzrichtlinie für SoulChord.","eyebrow":"SoulChord","title":"Datenschutzrichtlinie","updated":"Zuletzt aktualisiert: 12. Juli 2026","intro":"SoulChord ist ein Metronom, Stimmgerät und Rhythmus-Übungswerkzeug für iPhone, iPad und Mac. Diese Richtlinie erklärt die Datenverarbeitung.","summary":"Kurzfassung: kein Konto, keine Werbung, keine Analyse- oder Absturz-SDKs, kein Tracking; Audioanalyse erfolgt auf dem Gerät.","sections":[["Daten und Netzwerk","Die aktuelle Version enthält keine Konten, Cloud-Synchronisierung, Abonnements, In-App-Käufe, Werbung, Drittanbieter-Analysen oder netzwerkabhängige Kernfunktionen. Personenbezogene Daten, Übungsverlauf, Gerätekennungen oder Audio werden nicht an Entwicklerserver gesendet."],["Lokale Speicherung","Sprache, Einführung, Metronom-Einstellungen, gespeicherte Tempi, Darstellung, Übungszusammenfassungen und Timing-Ergebnisse werden lokal gespeichert."],["Mikrofon","Die Berechtigung wird nur beim Start von Stimmgerät oder Rhythmus-Hören angefordert. Tonhöhe und Timing werden auf dem Gerät analysiert; Rohaufnahmen werden weder gespeichert noch hochgeladen."],["Kamera-Taschenlampe","Auf dem iPhone fragt Flash-Sync nur nach Aktivierung nach der Kameraberechtigung und nutzt ausschließlich die rückseitige Lampe im Takt. Fotos oder Videos werden nicht aufgenommen, gespeichert oder übertragen."],["Hintergrundaudio und Haptik","Hintergrundaudio dient nur der Metronomwiedergabe beim Üben; Haptik wird lokal erzeugt."],["Support-E-Mail","Wir erhalten nur freiwillig gesendete Angaben wie E-Mail, Beschreibung, Screenshots und Gerätedaten. Senden Sie keine Passwörter oder vertraulichen Dateien."]],"contactTitle":"Kontakt und Optionen","contactBody":"Datenschutzfragen: kibernet@sina.com. Berechtigungen können jederzeit in den Systemeinstellungen widerrufen werden."}
    }

  <script>
    (()=>{const d=JSON.parse(document.getElementById('page-data').textContent),s=document.getElementById('language-select'),c=document.getElementById('content'),key='soulchord-page-language';
      const norm=v=>{if(!v)return'';v=v.toLowerCase();if(v==='zh'||v.startsWith('zh-cn')||v.startsWith('zh-sg')||v.includes('hans'))return'zh-Hans';if(v.startsWith('zh-tw')||v.startsWith('zh-hk')||v.startsWith('zh-mo')||v.includes('hant'))return'zh-Hant';const b=v.split(/[-_]/)[0];return d.languages.find(x=>x.code.toLowerCase()===v||x.htmlLang.toLowerCase()===v||x.code.toLowerCase().split('-')[0]===b)?.code||''};
      const pick=()=>{const h=norm(location.hash.slice(1));if(h)return h;try{const x=norm(localStorage.getItem(key));if(x)return x}catch{}for(const x of navigator.languages||[navigator.language]){const n=norm(x);if(n)return n}return d.defaultLanguage};
      const links=code=>document.querySelectorAll('nav a,.brand').forEach(a=>{const base=a.getAttribute('href').split('#')[0];a.href=code===d.defaultLanguage?base:`${base}#${code}`});
      const render=code=>{const lang=d.languages.find(x=>x.code===code)||d.languages.find(x=>x.code===d.defaultLanguage),u=d.ui[lang.code],x=d.content[lang.code];document.documentElement.lang=lang.htmlLang;document.documentElement.dir=lang.dir;document.title=x.metaTitle;document.querySelector('meta[name=description]').content=x.metaDescription;document.getElementById('language-label').textContent=u.language;s.setAttribute('aria-label',u.chooseLanguage);document.getElementById('nav-privacy').textContent=u.privacy;document.getElementById('nav-support').textContent=u.support;document.getElementById('nav-age').textContent=u.age;s.value=lang.code;links(lang.code);c.replaceChildren();const add=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;c.append(e);return e};add('p',x.eyebrow,'eyebrow');add('h1',x.title);add('p',x.updated,'updated');add('p',x.intro,'intro');const n=document.createElement('div');n.className='notice';const np=document.createElement('p');np.textContent=x.summary;n.append(np);c.append(n);x.sections.forEach(([t,b])=>{add('h2',t);add('p',b)});add('h2',x.contactTitle);add('p',x.contactBody);const row=document.createElement('div');row.className='links';[[u.support,'../Support/index.html'],[u.age,'../AgeRating/index.html']].forEach(([t,h])=>{const a=document.createElement('a');a.className='pill';a.textContent=t;a.href=lang.code===d.defaultLanguage?h:`${h}#${lang.code}`;row.append(a)});c.append(row);try{localStorage.setItem(key,lang.code)}catch{}};
      d.languages.forEach(x=>{const o=document.createElement('option');o.value=x.code;o.textContent=x.label;s.append(o)});s.addEventListener('change',()=>{history.replaceState(null,'',s.value===d.defaultLanguage?location.pathname:`#${s.value}`);render(s.value)});render(pick());
    })();
  </script>
</body>
