=document.createElement('thead'),tr=document.createElement('tr');[x.categoryHeader,x.statusHeader].forEach(t=>{const th=document.createElement('th');th.textContent=t;tr.append(th)});thead.append(tr);table.append(thead);const tb=document.createElement('tbody');x.rows.forEach(([a,b])=>{const r=document.createElement('tr');[a,b].forEach(t=>{const td=document.createElement('td');td.textContent=t;r.append(td)});tb.append(r)});table.append(tb);c.append(table);add('h2',x.audienceTitle);add('p',x.audienceBody);add('h2',x.notesTitle);const ul=document.createElement('ul');x.notes.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.append(li)});c.append(ul);add('h2',x.linksTitle);const row=document.createElement('div');row.className='links';[[u.privacy,'../Privacy/index.html'],[u.support,'../Support/index.html']].forEach(([t,h])=>{const a=document.createElement('a');a.className='pill';a.textContent=t;a.href=lang.code===d.defaultLanguage?h:`${h}#${lang.code}`;row.append(a)});c.append(row);try{localStorage.setItem(key,lang.code)}catch{}};d.languages.forEach(x=>{const o=document.createElement('option');o.value=x.code;o.textContent=x.label;s.append(o)});s.addEventListener('change',()=>{history.replaceState(null,'',s.value===d.defaultLanguage?location.pathname:`#${s.value}`);render(s.value)});render(pick())})();
  </script>
