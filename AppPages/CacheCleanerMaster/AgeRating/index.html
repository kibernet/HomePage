    for (const [code, values] of Object.entries(localized)) {
      content[code] = {
        docTitle: values[0],
        docDescription: values[0],
        language: "Language",
        chooseLanguage: values[1],
        eyebrow: "CacheGuardPro for Mac",
        title: values[1],
        updated: values[2],
        intro: content.en.intro,
        rating: values[3],
        summaryTitle: values[4],
        categoryHeader: values[5],
        statusHeader: values[6],
        useTitle: values[7],
        useBody: values[8],
        safetyTitle: values[9],
        safety: values[10],
        linksTitle: values[11],
        privacyLink: values[12],
        supportLink: values[13],
        rows: baseRows.en
      };
    }

    function pickLanguage() {
      const stored = localStorage.getItem("cacheguard-age-language");
      if (stored && content[stored]) return stored;
      const browser = navigator.language || "en";
      if (content[browser]) return browser;
      const base = browser.split("-")[0];
      if (base === "zh") return browser.includes("Hant") || browser.includes("TW") || browser.includes("HK") ? "zh-Hant" : "zh-Hans";
      return content[base] ? base : "en";
    }

    const select = document.getElementById("language-select");
    for (const language of languages) {
      const option = document.createElement("option");
      option.value = language.code;
      option.textContent = language.label;
      select.appendChild(option);
    }

    function applyLanguage(code) {
      const language = languages.find(item => item.code === code) || languages[0];
      const data = content[code] || content.en;
      document.documentElement.lang = language.htmlLang;
      document.documentElement.dir = language.dir;
      document.title = data.docTitle;
      document.querySelector('meta[name="description"]').setAttribute("content", data.docDescription);
      document.getElementById("language-label").textContent = data.language;
      select.setAttribute("aria-label", data.chooseLanguage);
      document.getElementById("eyebrow").textContent = data.eyebrow;
      document.getElementById("title").textContent = data.title;
      document.getElementById("updated").textContent = data.updated;
      document.getElementById("intro").textContent = data.intro;
      document.getElementById("rating").textContent = data.rating;
      document.getElementById("summary-title").textContent = data.summaryTitle;
      document.getElementById("category-header").textContent = data.categoryHeader;
      document.getElementById("status-header").textContent = data.statusHeader;
      document.getElementById("use-title").textContent = data.useTitle;
      document.getElementById("use-body").textContent = data.useBody;
      document.getElementById("safety-title").textContent = data.safetyTitle;
      document.getElementById("links-title").textContent = data.linksTitle;
      document.getElementById("privacy-link").textContent = data.privacyLink;
      document.getElementById("support-link").textContent = data.supportLink;

      const table = document.getElementById("rating-table");
      table.textContent = "";
      for (const [category, status] of data.rows) {
        const row = document.createElement("tr");
        const categoryCell = document.createElement("td");
        const statusCell = document.createElement("td");
        categoryCell.textContent = category;
        statusCell.textContent = status;
        row.append(categoryCell, statusCell);
        table.appendChild(row);
      }

      const safetyList = document.getElementById("safety-list");
      safetyList.textContent = "";
      for (const item of data.safety) {
        const li = document.createElement("li");
        li.textContent = item;
        safetyList.appendChild(li);
      }

      select.value = code;
      localStorage.setItem("cacheguard-age-language", code);
    }

    select.addEventListener("change", event => applyLanguage(event.target.value));
    applyLanguage(pickLanguage());
