        summary: "สรุป: เวอร์ชันปัจจุบันไม่เก็บข้อมูลส่วนบุคคล ไม่อัปโหลดเนื้อหาไฟล์ ไม่มี advertising SDK และไม่ติดตามผู้ใช้ข้ามแอปหรือเว็บไซต์",
        sections: [["ข้อมูลที่เก็บ", "เวอร์ชันปัจจุบันไม่ส่งผลสแกน ชื่อไฟล์ path เนื้อหาไฟล์ รายงานทำความสะอาด หรือ analytics ส่วนบุคคลไปยังเซิร์ฟเวอร์ของผู้พัฒนา"], ["ข้อมูลในเครื่อง", "แอปอาจเก็บสรุปการสแกน snapshot ประวัติ การตั้งค่า ภาษา และรายงานในบัญชีผู้ใช้ Mac รหัส Direct license เก็บใน macOS Keychain"], ["ขอบเขตการสแกน", "สแกนตำแหน่งความเสี่ยงต่ำ เช่น cache, log, downloads, developer cache, app leftovers, duplicates, large files และ Trash โฟลเดอร์ระบบ keychain Mail Messages Photos และ containers จะถูกป้องกันหรือหลีกเลี่ยงโดยค่าเริ่มต้น"], ["พฤติกรรมการทำความสะอาด", "ทำความสะอาดหลังผู้ใช้ยืนยันเท่านั้น ไฟล์ทั่วไปย้ายไป Trash ก่อน การลบถาวรต้องพิมพ์ยืนยัน และแอปตรวจ freshness อีกครั้งก่อนลบ"], ["ไลเซนส์ การซื้อ และอัปเดต", "การซื้อใน Mac App Store จัดการโดย Apple Direct build อาจเชื่อมต่อ Yaoji HTTPS endpoints เพื่อตรวจ license และ update manifest ที่ลงนาม โดยไม่ส่งเนื้อหาไฟล์"], ["การขอรับการสนับสนุน", "เมื่อคุณติดต่อฝ่ายสนับสนุน เราได้รับเฉพาะข้อมูลที่คุณเลือกส่ง อย่าส่งรหัสผ่าน private key ไฟล์ลับ หรือเนื้อหาไฟล์ส่วนตัว"]],
        contactTitle: "ติดต่อ",
        contactBody: "สำหรับคำถามด้านความเป็นส่วนตัว ติดต่อ " + emailLink + "."
      }
    };
    const storageKey = "cacheguard-page-language";
    const selector = document.getElementById("language-select");
    languages.forEach((language) => {
      const option = document.createElement("option");
      option.value = language.code;
      option.textContent = language.label;
      selector.appendChild(option);
    });
    function normalizeLanguage(value) {
      if (!value) return "";
      const lowered = value.toLowerCase();
      if (lowered === "zh-cn" || lowered === "zh-hans" || lowered.startsWith("zh-cn")) return "zh-Hans";
      if (lowered === "zh-tw" || lowered === "zh-hant" || lowered.startsWith("zh-tw") || lowered.startsWith("zh-hk")) return "zh-Hant";
      if (lowered.startsWith("pt")) return "pt-BR";
      const exact = languages.find((language) => language.code.toLowerCase() === lowered);
      if (exact) return exact.code;
      const prefix = languages.find((language) => lowered.startsWith(language.code.toLowerCase().split("-")[0]));
      return prefix ? prefix.code : "";
    }
    function requestedLanguage() {
      const hash = normalizeLanguage(window.location.hash.replace(/^#/, ""));
      if (hash) return hash;
      try {
        const stored = normalizeLanguage(localStorage.getItem(storageKey));
        if (stored) return stored;
      } catch (error) {}
      for (const language of navigator.languages || [navigator.language]) {
        const normalized = normalizeLanguage(language);
        if (normalized) return normalized;
      }
      return "en";
    }
    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }
    function render(languageCode) {
      const language = languages.find((candidate) => candidate.code === languageCode) || languages[0];
      const data = content[language.code] || content.en;
      document.documentElement.lang = language.htmlLang;
      document.documentElement.dir = language.dir;
      document.title = data.docTitle;
      document.querySelector('meta[name="description"]').setAttribute("content", data.docDescription);
      document.getElementById("language-label").textContent = data.language;
      selector.setAttribute("aria-label", data.chooseLanguage);
      selector.value = language.code;
      setText("eyebrow", data.eyebrow);
      setText("title", data.title);
      setText("updated", data.updated);
      setText("intro", data.intro);
      setText("summary", data.summary);
      const sections = document.getElementById("sections");
      sections.replaceChildren(...data.sections.flatMap(([headingText, bodyText]) => {
        const heading = document.createElement("h2");
        heading.textContent = headingText;
        const paragraph = document.createElement("p");
        paragraph.textContent = bodyText;
        return [heading, paragraph];
      }));
      setText("contact-title", data.contactTitle);
      document.getElementById("contact-body").innerHTML = data.contactBody;
      try { localStorage.setItem(storageKey, language.code); } catch (error) {}
    }
    selector.addEventListener("change", () => {
      const next = selector.value;
      history.replaceState(null, "", "#" + next);
      render(next);
    });
    window.addEventListener("hashchange", () => render(requestedLanguage()));
    render(requestedLanguage());
  </script>
</body>
