        if (exact) return exact;
        const prefix = raw.split("-")[0];
        return supported.find(code => code.toLowerCase().split("-")[0] === prefix) || data.defaultLanguage;
      };
      const preferredLanguage = () => normalize(localStorage.getItem(storageKey) || (navigator.languages && navigator.languages[0]) || navigator.language || data.defaultLanguage);
      const el = (tag, text, className) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const renderSection = section => {
        const fragment = document.createDocumentFragment();
        fragment.appendChild(el("h2", section.heading));
        (section.paragraphs || []).forEach(text => fragment.appendChild(el("p", text)));
        if (section.bullets) {
          const list = el("ul");
          section.bullets.forEach(text => list.appendChild(el("li", text)));
          fragment.appendChild(list);
        }
        return fragment;
      };
      const render = code => {
        const language = byCode[code] || byCode[data.defaultLanguage];
        const ui = data.ui[code] || data.ui[data.defaultLanguage];
        const content = data.content[code] || data.content[data.defaultLanguage];
        document.documentElement.lang = language.htmlLang;
        document.documentElement.dir = language.dir;
        document.title = content.metaTitle;
        document.querySelector("meta[name='description']").setAttribute("content", content.description);
        document.getElementById("language-label").textContent = ui.language;
        const select = document.getElementById("language-select");
        select.setAttribute("aria-label", ui.chooseLanguage);
        select.innerHTML = "";
        data.languages.forEach(item => {
          const option = document.createElement("option");
          option.value = item.code;
          option.textContent = item.label;
          option.selected = item.code === code;
          select.appendChild(option);
        });
        document.querySelector("[data-nav='privacy']").textContent = ui.privacy;
        document.querySelector("[data-nav='support']").textContent = ui.support;
        document.querySelector("[data-nav='age']").textContent = ui.age;
        const main = document.getElementById("localized-content");
        main.innerHTML = "";
        main.appendChild(el("p", content.eyebrow, "eyebrow"));
        main.appendChild(el("h1", content.title));
        main.appendChild(el("p", content.updated, "updated"));
        main.appendChild(el("p", content.intro, "intro"));
        const notice = el("div", undefined, "notice");
        notice.appendChild(el("p", content.notice));
        main.appendChild(notice);
        content.sections.forEach(section => main.appendChild(renderSection(section)));
        const linkRow = el("div", undefined, "link-row");
        content.links.forEach(link => {
          const anchor = el("a", link.label, "pill");
          anchor.href = link.href;
          linkRow.appendChild(anchor);
        });
        main.appendChild(linkRow);
      };
      const select = document.getElementById("language-select");
      let current = preferredLanguage();
      render(current);
      select.addEventListener("change", event => {
        current = normalize(event.target.value);
        localStorage.setItem(storageKey, current);
        render(current);
      });
    })();
  </script>
</body>
</html>
