  <script>
    (() => {
      const data = JSON.parse(document.getElementById("page-data").textContent);
      const storageKey = "ScreenSplitAssist.AppPages.language";
      const supported = data.languages.map((language) => language.code);
      const alias = {"zh-cn":"zh-Hans","zh-sg":"zh-Hans","zh-hans":"zh-Hans","zh-tw":"zh-Hant","zh-hk":"zh-Hant","zh-mo":"zh-Hant","zh-hant":"zh-Hant"};
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
      const resolveLanguage = () => {
        const stored = localStorage.getItem(storageKey);
        if (supported.includes(stored)) return stored;
        for (const raw of navigator.languages || [navigator.language]) {
          const normalized = String(raw || "").toLowerCase();
          if (alias[normalized]) return alias[normalized];
          const base = normalized.split("-")[0];
          if (supported.includes(base)) return base;
          if (base === "zh") return "zh-Hans";
        }
        return data.defaultLanguage;
      };
      const render = (code) => {
        const language = data.languages.find((item) => item.code === code) || data.languages.find((item) => item.code === data.defaultLanguage);
        const ui = data.ui[language.code];
        const content = data.content[language.code];
        document.documentElement.lang = language.htmlLang;
        document.documentElement.dir = language.dir;
        document.title = content.metaTitle;
        document.querySelector("meta[name='description']").setAttribute("content", content.description);
        document.getElementById("language-label").textContent = ui.language;
        document.getElementById("language-select").setAttribute("aria-label", ui.chooseLanguage);
        document.querySelector("[data-nav='privacy']").textContent = ui.privacy;
        document.querySelector("[data-nav='support']").textContent = ui.support;
        document.querySelector("[data-nav='age']").textContent = ui.age;
        document.getElementById("localized-content").innerHTML = `
          <p class="eyebrow">${escapeHtml(content.eyebrow)}</p>
          <h1>${escapeHtml(content.title)}</h1>
          <p class="updated">${escapeHtml(content.updated)}</p>
          <p class="intro">${escapeHtml(content.intro)}</p>
          <div class="rating">${escapeHtml(content.rating)}</div>
          <div class="notice"><p>${escapeHtml(content.notice)}</p></div>
          ${content.sections.map((section) => {
            const table = section.rows ? `<div class="table-wrap"><table><thead><tr>${section.columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}</tr></thead><tbody>${section.rows.map((row) => `<tr><td>${escapeHtml(row.category)}</td><td>${escapeHtml(row.status)}</td></tr>`).join("")}</tbody></table></div>` : "";
            const paragraphs = section.paragraphs ? section.paragraphs.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("") : "";
            const bullets = section.bullets ? `<ul>${section.bullets.map((bullet) => `<li>${escapeHtml(bullet)}</li>`).join("")}</ul>` : "";
            return `<section><h2>${escapeHtml(section.heading)}</h2>${table}${paragraphs}${bullets}</section>`;
          }).join("")}
          <div class="link-row">${content.links.map((link) => `<a class="pill" href="${escapeHtml(link.href)}">${escapeHtml(link.label)}</a>`).join("")}</div>`;
      };
      const select = document.getElementById("language-select");
      data.languages.forEach((language) => {
        const option = document.createElement("option");
        option.value = language.code;
        option.textContent = language.label;
        select.appendChild(option);
      });
      const initial = resolveLanguage();
      select.value = initial;
      render(initial);
      select.addEventListener("change", () => {
        localStorage.setItem(storageKey, select.value);
        render(select.value);
      });
    })();
  </script>
